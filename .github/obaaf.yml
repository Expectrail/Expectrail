# OBAAF checker configuration (https://github.com/Obaaf/OBAAF, docs/checker-configuration.md).
# CI runs the checker pinned to a reviewed OBAAF commit in reporting mode (the obaaf-audit job in
# ci.yml), and fails when this lane inventory and the checker's classification disagree.
#
# The checker does not recognise our model entry points (python -m agents.*), so every job that
# hands a model untrusted input and acts on what it says is declared here as an agent lane, whether
# the model is Meta's or a bring-your-own provider's.
# A new model entry point needs a line here and review; agents/assurance/audit.py takes the keys
# that count from the provider and BYO-agent registries, so it sees a new provider's key without
# being edited, and fails here until the job holding it is declared or declared perception-only.
# Jobs that only send frames to a perception model (SAM 3.1, Muse Glimmer: sam-probe.yml,
# glimmer-probe.yml, fix-matrix.yml#sam-warm) are not agents; they still hold model keys, and the
# credential findings for them are reported, not suppressed.
lanes:
  ".github/workflows/ci.yml#agents-live-muse": agent             # Muse Code fixes, live gate
  ".github/workflows/ci.yml#agents-bench-compare-live": agent    # Muse judges screenshots
  ".github/workflows/ci.yml#agents-oct29-film": agent            # Muse Code fixes, recorded film
  ".github/workflows/feedback-live.yml#feedback-live": agent     # Muse drafts specs from playtest feedback
  ".github/workflows/fix-matrix.yml#run": agent                  # Muse Code fixes, Gate 2 matrix
  ".github/workflows/fix-matrix.yml#judge-run": agent            # Muse judges candidate fixes
  ".github/workflows/fix-matrix.yml#demo-run": agent             # the overnight loop end to end
  ".github/workflows/spark-open.yml#spark-open": agent           # Muse Spark Open drafts specs
  ".github/workflows/fix-matrix.yml#gateway-probe": agent        # Muse Code behind the key gateway (experiment)
  ".github/workflows/web-fix.yml#run": agent                     # Muse Code fixes the checkout page, second domain
  ".github/workflows/mutation-fix.yml#run": agent                # Muse Code fixes generated bugs, mutation bench Part 3
  ".github/workflows/case-spend.yml#run": agent                   # Muse/SAM spend counters for fix-matrix and judge
  ".github/workflows/discovery.yml#discovery-planner": agent     # Muse Spark plans discovery probes and contracts (main only)
  ".github/workflows/discovery-blind.yml#blind": agent           # the same, on the private fresh set (counts only)
  ".github/workflows/jit.yml#propose": agent                     # Muse Spark proposes checks for one change (docs/jit.md)
  ".github/workflows/jit.yml#revise": agent                      # the same, once more, for the checks replay rejected
  ".github/workflows/byo-live.yml#byo-live": agent               # Claude triages, Claude Code fixes (BYO, manual)
  ".github/workflows/byo-gateway-probe.yml#byo-gateway-probe": agent  # the same, behind the key gateway (experiment)
  # Not an agent: it calls each configured provider once and acts only on whether text came back.
  # Not perception either, so it has a lane of its own (agents/assurance/audit.py, the probe lane).
  ".github/workflows/byo-smoke.yml#byo-smoke": probe             # one live call per provider, nothing acts on it

# Secrets that must never be available outside an environment (OBAAF-GHA-024). Anyone with write
# access could read a repository secret by pushing a workflow on a branch, so these live only in the
# main-only environment, which only main's workflows can use.
protected_secrets:
  HELDOUT_TOKEN: main-only
  "*_API_KEY": main-only

# Reviewed findings. Each entry says why it does not apply and expires, so it is reviewed again.
ignore:
  - rule: OBAAF-GHA-001
    path: .github/workflows/private-scan.yml
    job: private-export-scan
    reason: >-
      pull_request_target runs as main, so the main-only environment's branch rule does not stop it.
      Same-repository pull requests only; the scanner comes from main and reads the pull request's
      files as data, printing counts, never names or text. Residual risk: counts are an oracle a
      writer could probe across many pushes. Revisit with required reviewers on this job.
    until: 2027-02-09
  - rule: OBAAF-GHA-002
    path: .github/workflows/private-scan.yml
    job: private-export-scan
    reason: >-
      The pull request is checked out to scanned/ as data with persist-credentials false; nothing
      from it is run or imported (Python runs from main's checkout), see the workflow's header.
    until: 2027-02-09
  - rule: OBAAF-GHA-001
    path: .github/workflows/unity.yml
    job: build
    reason: >-
      The Unity licence lives in the unity environment, which requires Sean's approval for every
      run, so a pull request's build gets it only after a maintainer approves that run.
    until: 2027-02-09
