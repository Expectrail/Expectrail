# "Run it" on expectrail.tech (#265; docs/run-it.md). The site's edge function dispatches this on
# main with one sample id from docs/run-it/samples.json and a request id it minted (a UUID). Nothing
# else a visitor types reaches this workflow.
#
# Two jobs, so the job that runs the game holds nothing worth taking:
#   verify   contents: read, no secret, no environment. Replays the sample's game inside the replay
#            sandbox and judges it under the two-observer rule, with the vision model's answers
#            replayed from the sample's recording (Sean's decision of November 13: Option A). No
#            model is called and no key exists here. Uploads the output folder.
#   publish  contents: write. Never runs the game, the harness or anything from the sample: it
#            downloads verify's folder as data, checks it against an allowlist with main's
#            `expectrail.runit check`, and commits it to the branch run-it-results under <request id>/.
#
# One run at a time: GitHub keeps one pending run per concurrency group and cancels the rest, so the
# edge function refuses a request while one is queued or running.
name: Run it
# The edge function finds the run it dispatched by this name (apps/run-it-edge/service.js).
run-name: Run it ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      sample:
        description: A sample id from docs/run-it/samples.json
        required: true
      request_id:
        description: The request id the edge function minted (lower-case letters, digits and hyphens)
        required: true

permissions: {}

concurrency:
  group: run-it
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check the inputs before anything is checked out
        env:
          SAMPLE: ${{ inputs.sample }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$SAMPLE" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "::error::the sample is not a sample id"; exit 1; }
          [[ "$REQUEST_ID" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "::error::the request id is not a request id"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install a virtual display, software OpenGL, patch and bubblewrap
        uses: ./.github/actions/apt-install
        with:
          packages: xvfb libgl1-mesa-dri libglx-mesa0 patch bubblewrap
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
      - name: Run the sample, every replay sandboxed, vision answers from its recording
        env:
          SAMPLE: ${{ inputs.sample }}
          REQUEST_ID: ${{ inputs.request_id }}
          EXPECTRAIL_SANDBOX: require
        run: python -m expectrail.runit run --sample "$SAMPLE" --request-id "$REQUEST_ID" --out "run-it/$REQUEST_ID" --require-sandbox
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-it
          path: run-it
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check the inputs before anything is checked out
        env:
          SAMPLE: ${{ inputs.sample }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$SAMPLE" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "::error::the sample is not a sample id"; exit 1; }
          [[ "$REQUEST_ID" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "::error::the request id is not a request id"; exit 1; }
      # main's own code, for its checker. Nothing from the verify job's folder is ever run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # Outside the checkout, so no file in it can be imported by the checker.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: run-it
          path: ${{ runner.temp }}/incoming
      - name: Check the folder against the allowlist (expectrail.runit check)
        env:
          SAMPLE: ${{ inputs.sample }}
          REQUEST_ID: ${{ inputs.request_id }}
          INCOMING: ${{ runner.temp }}/incoming
        run: |
          listed="$(ls -A "$INCOMING")"
          [[ "$listed" == "$REQUEST_ID" ]] || { echo "::error::the upload holds something other than this request's folder"; exit 1; }
          python -m expectrail.runit check "$INCOMING/$REQUEST_ID" --sample "$SAMPLE" --request-id "$REQUEST_ID"
      - name: Commit the folder to run-it-results/<request id>
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUEST_ID: ${{ inputs.request_id }}
          INCOMING: ${{ runner.temp }}/incoming
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git init -q "$RUNNER_TEMP/results" && cd "$RUNNER_TEMP/results"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth 1 "$url" run-it-results 2>/dev/null; then
              git checkout -q -B run-it-results FETCH_HEAD
            else
              git checkout -q --orphan run-it-results
            fi
            if [[ -e "$REQUEST_ID" ]]; then echo "::error::a run with this request id is already published"; exit 1; fi
            cp -r "$INCOMING/$REQUEST_ID" "$REQUEST_ID"
            # latest.json: the page's index of the latest run of each sample (main's code, run from main's checkout).
            (cd "$GITHUB_WORKSPACE" && python -m expectrail.runit_site latest "$RUNNER_TEMP/results" "$REQUEST_ID")
            git add -A "$REQUEST_ID" latest.json && git commit -q -m "Run it: $REQUEST_ID"
            if git push -q "$url" HEAD:run-it-results; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
