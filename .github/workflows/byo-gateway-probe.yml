# Does Claude Code still work when the key gateway holds its key and the sandbox has no network?
#
# Muse Code already runs this way (agents/gateway.py): a placeholder of the key's length, an
# mitmproxy that holds the real key and swaps it in for an allowlisted host only, and under
# bubblewrap no network of its own, so the proxy is the only way out. agents/byo_fixer.py can now
# put a BYO agent behind the same gateway with EXPECTRAIL_BYO_GATEWAY=on, with the allowlist derived
# from the provider that owns the agent's key (api.anthropic.com for claude-code).
#
# Whether Claude Code tolerates it was a question, not an assumption, which is why this is a probe
# and not a default. Answered once, on run 42752549697: it completed an accepted fix behind the
# gateway with no network of its own, in 100,962ms against 100,989ms for the same loop with the
# gateway off. It also tried http-intake.logs.us5.datadoghq.com (Datadog telemetry), which the
# gateway refused before any key swap, and the run succeeded regardless — so the allowlist does not
# need widening for Claude Code to work.
#
# Still a probe, not a default: that is one run on one defect with one agent. The answer is in the
# gateway's own record — the hosts the agent tried, which of them were refused, and the header names
# the placeholder was swapped into. Manual only, and it spends Anthropic credit.
name: BYO gateway probe (a coding agent behind the key gateway)

on:
  workflow_dispatch:
    inputs:
      agent:
        description: which BYO coding agent to put behind the gateway
        type: choice
        options: ["claude-code", "codex"]
        default: "claude-code"
      runs:
        description: independent loop runs
        default: "1"
        required: true
      gateway:
        description: the key gateway (off reproduces today's behaviour for comparison)
        type: choice
        options: ["on", "off"]
        default: "on"
      require_sandbox:
        description: fail unless the agent runs under bubblewrap (off separates a sandbox problem from an agent one)
        type: choice
        options: ["on", "off"]
        default: "on"

permissions:
  contents: read

jobs:
  byo-gateway-probe:
    runs-on: ubuntu-24.04
    environment: provider-keys
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Require the secret this agent's provider needs
        env:
          AGENT: ${{ inputs.agent }}
          ANTHROPIC_SET: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          OPENAI_SET: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          case "$AGENT" in
            codex) [ "$OPENAI_SET" = "true" ] || { echo "::error::codex needs the OPENAI_API_KEY repository secret."; exit 1; } ;;
            *)     [ "$ANTHROPIC_SET" = "true" ] || { echo "::error::claude-code needs the ANTHROPIC_API_KEY repository secret."; exit 1; } ;;
          esac
      - run: python -m pip install -r requirements-dev.txt
      - name: Install mitmproxy, bubblewrap, xvfb, software OpenGL
        run: |
          python -m pip install mitmproxy
          mitmdump --version | head -1
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
      - name: Install the agent's CLI (under /usr/local, which the sandbox already binds read-only)
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          if [ "$AGENT" = "codex" ]; then
            sudo npm install -g @openai/codex
          else
            sudo npm install -g @anthropic-ai/claude-code
          fi
      - name: Record the interface the CLI actually has
        # agents/byo_fixer.py builds the argv from this repository's idea of the CLI, and that idea
        # was stale for codex: it still used the legacy TypeScript flags (--quiet --approval-mode)
        # long after `codex exec` replaced them, because no live codex run had ever been attempted.
        # Printing the version and the help puts the real interface in the log, so a failure below
        # can be read as "wrong flags" or "something else" without guessing.
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          if [ "$AGENT" = "codex" ]; then
            codex --version
            codex exec --help || echo "::warning::codex exec --help failed; the adapter's flags may not match this CLI"
          else
            claude --version
          fi
      - name: Download Godot
        run: ./harness/get_godot.sh
      - name: Run the loop with the fixer behind the key gateway
        # Triage stays on Anthropic whichever agent fixes, so the only thing that changes between
        # runs is the agent behind the gateway. The agent receives only its own provider's key
        # (agents/keys.py, BYO_AGENT_KEY_ENVS), and the gateway's allowlist is derived from it.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ inputs.agent == 'codex' && secrets.OPENAI_API_KEY || '' }}
          EXPECTRAIL_LLM_PROVIDER: anthropic
          EXPECTRAIL_FIXER_AGENT: ${{ inputs.agent }}
          EXPECTRAIL_OBS_PROVIDER: trace
          EXPECTRAIL_BYO_GATEWAY: ${{ inputs.gateway }}
          RUNS: ${{ inputs.runs }}
          REQUIRE_SANDBOX: ${{ inputs.require_sandbox }}
        run: |
          extra=""
          if [ "$REQUIRE_SANDBOX" = "on" ]; then extra="--require-sandbox"; fi
          python -m agents.loop --out runs/byo-gateway --mode live --runs "$RUNS" \
            --no-skip-harness $extra
      - name: What the gateway saw
        if: always()
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root = Path("runs/byo-gateway")
          print("## Claude Code behind the key gateway\n")
          for c in sorted(root.rglob("candidate.json")):
              d = json.loads(c.read_text())
              s = d.get("sandbox", {})
              g = s.get("gateway", {})
              print(f"- `{c.parent.relative_to(root)}`: source={d.get('source')} ok={d.get('ok')} "
                    f"sandbox={s.get('kind')} network={s.get('network')} keyEnvs={s.get('keyEnvs')}")
              print(f"  - gateway: mode={g.get('mode')} requests={g.get('requests')}")
              # hosts is every host the agent tried, not every host allowed (agents/gateway.py,
              # Gateway.summary). Labelling it "allowed" put the blocked host on both lines and
              # read as a contradiction, in the output whose only job is to be checkable.
              seen = g.get("hosts") or []
              blocked = g.get("blockedHosts") or []
              print(f"  - hosts the agent tried: {seen}")
              print(f"  - refused by the gateway: {blocked}")
              print(f"  - reached: {[h for h in seen if h not in blocked]}")
              print(f"  - the placeholder was swapped into: {g.get('swappedHeaders')}")
          report = root / "morning-report.md"
          if report.is_file():
              print("\n" + report.read_text())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: byo-gateway-probe
          path: |
            runs/byo-gateway/
            !runs/byo-gateway/**/fixer-work/
            !runs/byo-gateway/**/fixer-baseline/
          retention-days: 30
