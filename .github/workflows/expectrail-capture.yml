name: Expectrail capture
on: workflow_call
permissions:
  contents: read
jobs:
  capture:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - run: mv candidate "$RUNNER_TEMP/candidate"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install jsonschema==4.26.0
      - uses: ./.github/actions/apt-install
        with:
          packages: xvfb libgl1-mesa-dri libglx-mesa0 patch bubblewrap
      - uses: ./.github/actions/get-godot
      - name: Enable replay namespaces on the hosted runner
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Capture the two games using base policy
        env:
          GAME: game/platformer
          SPECS: agents/specs
          ROUTES: |
            harness/routes/smoke.json
            harness/routes/combat.json
        run: python -m tools.ci_bundle "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/expectrail-$GITHUB_RUN_ATTEMPT.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ${{ runner.temp }}/expectrail-${{ github.run_attempt }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
