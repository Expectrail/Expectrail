# The private scan, first half: hand a pull request's files to main's scanner, as data.
#
# This job holds no secret and no environment. It packs the files the scan reads (bench, docs, apps,
# README.md, as Git lists them at the pull request's head) into one archive and uploads it. When it
# finishes, private-scan.yml runs from main (workflow_run), checks every file in the archive against
# the commit's own tree, and scans them with main's scanner.
#
# A pull request runs its own copy of this file, so it can upload anything it likes. That gains it
# nothing: the second half writes a file only when its bytes are the commit's, and fails when a file
# of the commit is missing. Same-repository pull requests only, as before.
name: Private scan collect

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: private-scan-collect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  private-scan-collect:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the pull request's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pack the files the scan reads
        run: |
          mkdir -p "$RUNNER_TEMP/private-scan-input"
          git ls-files -z -- bench docs apps README.md \
            | tar --no-recursion --null --files-from=- -cf "$RUNNER_TEMP/private-scan-input/files.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-scan-input
          path: ${{ runner.temp }}/private-scan-input/files.tar
          if-no-files-found: error
          retention-days: 1
