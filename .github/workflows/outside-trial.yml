# Expectrail on Godot projects made by other people (#263).
#
# Each project in tests/outside/projects.json is fetched at its pinned commit, laid out as a
# checkout with our own routes, and verified with the command a stranger would run. The projects'
# code is not ours, so this job holds no secret, has a read-only token, and requires the replay
# sandbox for every replay. The registry declares the outcome and diagnostics expected for each
# case. A draft-only case can expect a preflight refusal with the stated diagnostic. The trial
# reports whether the evidence matches those expectations. The repair comparisons report their own results.
name: Outside projects trial

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/outside/**'
      - 'tools/outside_trial.py'
      - 'tools/metamorphic_outside.py'
      - 'tools/metamorphic_public.py'
      - 'expectrail/jit/metamorphic.py'
      - 'harness/godot/**'
      - '.github/workflows/outside-trial.yml'

permissions:
  contents: read

concurrency:
  group: outside-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  outside-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install a virtual display, software OpenGL and bubblewrap
        uses: ./.github/actions/apt-install
        with:
          packages: xvfb libgl1-mesa-dri libglx-mesa0 patch bubblewrap
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Install the schema checker the registry reader needs
        run: python -m pip install jsonschema==4.26.0
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
      - name: Verify each outside project, every replay in the sandbox
        id: projects
        run: python -m tools.outside_trial --fetch --execution-class isolated --out runs/outside
      - name: Compare four proposed kinematic-character repairs through the local app backend
        if: ${{ !cancelled() && (steps.projects.outcome == 'success' || steps.projects.outcome == 'failure') }}
        shell: bash
        run: |
          set -o pipefail
          python -m tests.outside.repair_pair --out runs/outside/repair-pair | tee -a "$GITHUB_STEP_SUMMARY"
      - name: What happened, in the summary
        if: always()
        run: |
          {
            echo "## Outside projects trial"
            echo
            if [ -f runs/outside/outside-trial.md ]; then cat runs/outside/outside-trial.md; else echo "No result was written."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the result and the records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: outside-trial
          path: |
            runs/outside/outside-trial.json
            runs/outside/outside-trial.md
            runs/outside/repair-pair/repair-pair.json
            runs/outside/repair-pair/*-evidence.html
            runs/outside/jobs/**/status.json
            runs/outside/jobs/**/findings.json
          retention-days: 30

  # Mirror-inputs metamorphic checks (#675, piece 3) on kinematic-character, fetched at its pinned
  # commit: as pinned and the player's do-nothing control three times each, each declared change and
  # a seeded drag-left fault once, every replay in the sandbox. No model, no secret. Advisory: the
  # counts are a measurement, and the job fails only when the measurement could not be made.
  metamorphic-outside:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install a virtual display, software OpenGL and bubblewrap
        uses: ./.github/actions/apt-install
        with:
          packages: xvfb libgl1-mesa-dri libglx-mesa0 patch bubblewrap
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Install the schema checker the registry reader needs
        run: python -m pip install jsonschema==4.26.0
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
      - name: Measure the mirror checks on kinematic-character, every replay in the sandbox
        shell: bash
        run: |
          set -o pipefail
          python -m tools.metamorphic_outside --fetch --workers 4 --out runs/metamorphic-outside | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metamorphic-outside
          path: |
            runs/metamorphic-outside/rows.json
            runs/metamorphic-outside/metamorphic-outside.md
          retention-days: 30
