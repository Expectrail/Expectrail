# Tests for the contracts and the evaluator, and a capture smoke test that renders the game on a
# GPU-less runner exactly the way the overnight pipeline will.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily offline E2E film (UTC morning) — no Meta spend.
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch the baseline commit (the discovery freeze and the mutation registration are checked against it)
        run: git fetch --no-tags --depth=1 origin c169a5e0da304773587304ed47bc8aabcec80da7
      - run: python -m unittest discover -s tests -t . -v
      - name: Export scan of the public repository (keys and signing keys; private names are checked by private-scan.yml and on main)
        run: python -m agents.export_scan bench docs README.md apps --paths error

  # OBAAF (docs/obaaf.md), pinned to the reviewed commit: the lane inventory in .github/obaaf.yml
  # must hold, every finding is reported, any finding not in .github/obaaf-baseline.json fails (as
  # does a baseline entry that no longer matches, so fixes are locked in), and candidate fixes become
  # proposals that OBAAF's checker accepts or refuses before any game code runs.
  obaaf-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install OBAAF from the reviewed commit (hash-pinned dependencies, its own venv)
        uses: Obaaf/OBAAF/actions/setup-obaaf@d014b6366b5f1b14b8bf13a3b07c6d3727a4a1e4
      - name: Lane inventory and findings
        run: |
          obaaf check . --lanes > obaaf-lanes.txt
          obaaf check . --format json --fail-on never --output obaaf-audit.json
          "$pythonLocation/bin/python" -m agents.assurance.audit --lanes obaaf-lanes.txt --report obaaf-audit.json
      - name: No new findings (the baseline is the list of accepted ones; regenerate it to lock in a fix)
        run: obaaf check . --baseline .github/obaaf-baseline.json --fail-on low --no-fixes
      - name: Proposals - the real fix passes; workflow, verifier and spec edits, symlinks and extra files are refused
        run: |
          set +e
          "$pythonLocation/bin/python" -m unittest tests.test_assurance -v > obaaf-tests.log 2>&1
          code=$?
          set -e
          tail -n 3 obaaf-tests.log
          if [ "$code" -ne 0 ]; then
            # One annotation per failing test, with the last lines of its traceback (public material only).
            "$pythonLocation/bin/python" - <<'PY'
          import re
          text = open("obaaf-tests.log").read()
          for block in re.split(r"^=+$", text, flags=re.M)[1:]:
              lines = [ln for ln in block.strip().splitlines() if ln.strip() and not set(ln) <= set("-")]
              if lines:
                  print(f"::error title={lines[0][:120]}::" + " | ".join(lines[-6:])[:900])
          PY
            exit "$code"
          fi
          "$pythonLocation/bin/python" -m agents.assurance.proposal --seed bugs/physics-fall-through/v1.patch \
            --candidate agents/fixtures/fix-collision-mask.patch --out runs/obaaf-proposal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: obaaf-audit
          path: |
            obaaf-lanes.txt
            obaaf-audit.json
            runs/obaaf-proposal/proposal/
            runs/obaaf-proposal/normalization.json
            runs/obaaf-proposal/proposal-check.json
          retention-days: 14

  capture-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install a virtual display and software OpenGL
        uses: ./.github/actions/apt-install
        with:
          packages: xvfb libgl1-mesa-dri libglx-mesa0
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Render the smoke route twice and compare
        run: python -m harness.replay_check --route harness/routes/smoke.json --runs 2 --out runs/ci
      - name: A candidate's game code cannot read the verifier's environment
        env:
          EXPECTRAIL_CANARY: canary-${{ github.run_id }}
          EXPECTRAIL_HELDOUT_DIR: /canary/private/path
        run: |
          # harness/fixtures/canary-env.patch prints both variables from GDScript. Before the harness
          # gave Godot an allowlisted environment, it printed them (checked locally on Oct 30).
          python -m harness.run --route harness/routes/smoke.json --out runs/canary --patch harness/fixtures/canary-env.patch
          grep -qx "CANARY_ENV=" runs/canary/godot.log
          grep -qx "CANARY_HELDOUT=" runs/canary/godot.log
          if grep -q -e "$EXPECTRAIL_CANARY" -e "/canary/private/path" runs/canary/godot.log; then
            echo "::error::the patched game read the verifier's environment"; exit 1
          fi
      - name: Keep the frames of the first run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-frames
          path: |
            runs/ci/run-00/frames/
            runs/ci/run-00/replay.json
            runs/ci/run-00/trace.json
            runs/ci/summary.json
          retention-days: 7

  # Every seeded bug must change what the player sees; an invisible variant is a benchmark case
  # nothing could ever catch.
  # Second domain (apps/checkout): Chromium replays the checkout sessions byte for byte, and the layout
  # and behaviour checks (no model, no secret) see the bugs they are meant to and nothing on the clean page.
  web-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -r requirements-web.txt
      # Playwright's --with-deps calls apt itself, which fails when Ubuntu's mirror is down. The fonts are
      # the only packages it adds to the ubuntu-24.04 runner image (read from its log on November 11);
      # they go through apt-install, and Chromium's libraries are already on the image.
      - name: Fonts Chromium renders with
        uses: ./.github/actions/apt-install
        with:
          packages: fonts-freefont-ttf fonts-ipafont-gothic fonts-tlwg-loma-otf fonts-unifont fonts-wqy-zenhei xfonts-cyrillic xfonts-encodings xfonts-scalable xfonts-utils
      - name: Install Chromium for Playwright
        uses: ./.github/actions/get-chromium
      - name: Open every page of the site in Chromium (script errors, missing files, broken links)
        run: |
          python -m unittest tests.test_check_pages -v
          python -m agents.check_pages docs
      - name: Web adapter tests, including two byte-identical replays
        run: python -m unittest tests.test_web -v
      - name: Every variant on both routes, layout and behaviour only
        run: |
          for v in $(python -m agents.web_bench --list --set dev | python -c "import json,sys; print(' '.join(json.load(sys.stdin)))"); do
            python -m agents.web_bench --variant "$v" --out runs/web-bench | grep '^::notice title=\(Dev\|Held-out\) bench'
          done
          python - <<'PY'
          import json
          from pathlib import Path
          docs = {d["variant"]: d for d in (json.loads(p.read_text()) for p in Path("runs/web-bench").glob("*/bench.json"))}
          assert docs["clean"]["caughtWithSamOff"] == "no", docs["clean"]
          seen = sorted(k for k, d in docs.items() if k != "clean" and d["caughtWithSamOff"] == "yes")
          # Without vision, the bugs that move the layout or stop the order; the four only the screen shows wait for SAM.
          assert seen == ["dev/fall-through/v1", "dev/fall-through/v2", "dev/layering/v1", "dev/sinking/v1"], seen
          print("layout and behaviour see", seen)
          PY

  seeded-bugs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install a virtual display and software OpenGL
        uses: ./.github/actions/apt-install
        with:
          packages: xvfb libgl1-mesa-dri libglx-mesa0 patch bubblewrap
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
      - name: "The replay's sandbox: escapes refused by real processes and the real engine, same hashes"
        env:
          EXPECTRAIL_SANDBOX_TESTS: required
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest tests.test_replay_sandbox -v
      - name: Replay every seeded bug against the clean game, each replay sandboxed
        env:
          EXPECTRAIL_SANDBOX: require
        run: python -m harness.check_seeded --out runs/seeded-check
      # Three real verifications through the orchestrator (docs/orchestrator.md): the bundled game as it
      # is (accept), with the seeded fall-through bug (reject), and the repair (accept). No model key.
      # The step fails unless all three decide that way.
      - name: Verification as a job, on the bundled game (accept, reject, accept), each replay sandboxed
        env:
          EXPECTRAIL_SANDBOX: require
        run: python -m expectrail.orchestrator --jobs-root runs/orchestrator-sample sample
      - name: The ground line is logged, and the position log sees a robot resting too low
        run: |
          python -m pip install -r requirements-dev.txt
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.observations import from_trace_synthetic, with_reference_ground
          from expectrail.contracts import load
          from expectrail.evaluator import evaluate
          spec = load("agents/specs/player-stays-above-ground.json", "test-spec")
          root = Path("runs/seeded-check")
          clean = json.loads((root / "clean" / "trace.json").read_text())
          rows = [r for r in clean["rows"] if r.get("player")]
          assert rows and all("ground" in r and "view" in r for r in rows), "harness did not log ground and view"
          level = clean["levelSurfaces"]
          assert level, "harness did not log the level surfaces"
          # The harness's ground search and the verifier's, over the same clean level's collision, must
          # agree. levelArt is set aside here: the verifier's line also follows the floor as drawn.
          collision = {k: v for k, v in clean.items() if k != "levelArt"}
          assert all(abs(a["ground"] - b["ground"]) < 0.01
                     for a, b in zip(rows, [r for r in with_reference_ground(collision, level)["rows"] if r.get("player")])), "ground searches disagree"
          # The floor as drawn is logged, and on the clean game it stays within the grass of the
          # collision: the line it gives is never lower, and at most 2 px higher (measured 0 to 2).
          assert clean.get("levelArt", {}).get("columns"), "harness did not log the level art"
          drawn = [r for r in with_reference_ground(clean, level)["rows"] if r.get("player")]
          lift = [a["ground"] - b["ground"] for a, b in zip(rows, drawn)]
          assert all(-0.01 < d < 3 for d in lift), f"drawn floor off the collision on the clean game: {min(lift)} to {max(lift)} px"
          results = {name: evaluate(spec, from_trace_synthetic(with_reference_ground(
                         json.loads((root / name / "trace.json").read_text()), level)))["result"]
                     for name in ("clean", "sinking_v1", "sinking_v2")}
          print(results)
          # sinking v2 moves only the drawing, so the position log cannot see it; the SAM hybrid does.
          assert results == {"clean": "pass", "sinking_v1": "fail", "sinking_v2": "pass"}, results
          PY
      - name: Keep the summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seeded-check
          path: runs/seeded-check/summary.json
          retention-days: 7

  agents-gate1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Gate 1 accept path (fixture candidate + synthetic observations)
        run: |
          python -m agents.gate1 --out runs/agents-gate1 --skip-harness \
            --observations agents/fixtures/obs-fixed.json \
            --candidate-patch agents/fixtures/fix-collision-mask.patch
          python -c "import json; from expectrail.contracts import validate; from pathlib import Path; d=json.load(open('runs/agents-gate1/verify/verification.json')); assert d['decision']=='accept', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='pass', d; md=Path('runs/agents-gate1/morning/morning-report.md').read_text(); assert '## Gameplay' in md and '## Suite provenance' in md, md; rc=json.load(open('runs/agents-gate1/morning/release-candidate.json')); validate(rc,'release-candidate'); assert rc['decision']=='accept'"
      - name: Freeze-player must reject
        run: |
          python -m agents.orchestrator \
            --spec agents/specs/player-stays-above-ground.json \
            --verdict contracts/examples/verdict.json \
            --route harness/routes/smoke.json \
            --base-patch bugs/physics-fall-through/v1.patch \
            --out runs/agents-negatives/repair-request.json
          python -m agents.fixer --request runs/agents-negatives/repair-request.json \
            --out runs/agents-negatives/freeze \
            --candidate-patch agents/fixtures/freeze-player.patch
          python -m agents.verifier --request runs/agents-negatives/repair-request.json \
            --candidate runs/agents-negatives/freeze/candidate.patch \
            --out runs/agents-negatives/freeze-verify \
            --skip-harness --observations agents/fixtures/obs-freeze.json \
            && exit 1 || true
          python -c "import json; from expectrail.contracts import validate; from agents.gameplay import REASON_DELTA; from agents.verifier import GAMEPLAY_SPEC_ID; d=json.load(open('runs/agents-negatives/freeze-verify/verification.json')); assert d['decision']=='reject', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='fail', d; g=json.load(open('runs/agents-negatives/freeze-verify/verdict-gameplay.json')); validate(g,'gameplay-verdict'); assert g['spec']==GAMEPLAY_SPEC_ID, g; assert g['reason']==REASON_DELTA, g; assert g['metrics']['minDeltaX']==g['minDeltaX'], g"
          set +e
          python -m agents.report --verification runs/agents-negatives/freeze-verify/verification.json --candidate runs/agents-negatives/freeze/candidate.patch --gameplay-verdict runs/agents-negatives/freeze-verify/verdict-gameplay.json --before agents/fixtures/frames/before-fall.png --after agents/fixtures/frames/after-fixed.png --out runs/agents-negatives/freeze-morning
          report_status=$?
          set -e
          test "$report_status" -eq 1
          python -c "from pathlib import Path; from expectrail.contracts import validate; import json; from agents.gameplay import REASON_DELTA; md=Path('runs/agents-negatives/freeze-morning/morning-report.md').read_text(); assert '## Gameplay' in md and REASON_DELTA in md, md; rc=json.load(open('runs/agents-negatives/freeze-morning/release-candidate.json')); validate(rc,'release-candidate'); assert rc['decision']=='reject'"
      - name: Trust beat (signing key absent from fixer + canary probe film)
        run: |
          python -m agents.trust --out runs/agents-trust
          python -c "import json; from pathlib import Path; d=json.load(open('runs/agents-trust/trust.json')); assert d['ok'] and d['mountLocalCanaryDenied']; a=json.load(open('runs/agents-trust/canary-attempts.json')); assert any(x['mountLocal'] and not x['exists'] for x in a); md=Path('runs/agents-trust/trust-evidence.md').read_text(); assert 'Canary probe' in md and 'DENIED' in md"
      - name: Prove-live trust-only film (playbook item 2, no Muse spend)
        run: |
          python -m agents.prove_live --out runs/agents-prove-trust --trust-only
          python -c "from pathlib import Path; md=Path('runs/agents-prove-trust/prove.md').read_text(); assert 'Overall: PASS' in md; assert Path('runs/agents-prove-trust/trust/canary-attempts.json').is_file()"
      - name: Daily offline E2E (no Meta spend)
        run: |
          python -m agents.daily --out runs/agents-daily --mode offline
          python -c "import json; from pathlib import Path; d=json.load(open('runs/agents-daily/daily.json')); assert d['status']=='pass', d; assert d['effectiveMode']=='offline'; assert Path('runs/agents-daily/loop/morning-report.md').is_file()"
      - name: Mixed overnight films gameplay reject in rollup
        run: |
          python -m agents.loop --out runs/agents-loop-accept --runs 1 --mode offline
          python -m agents.loop --out runs/agents-loop-freeze --runs 1 --mode offline \
            --candidate-patch agents/fixtures/freeze-player.patch \
            --observations agents/fixtures/obs-freeze.json || true
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from agents.gameplay import REASON_DELTA
          from agents.report import write_loop_rollup
          from agents.verifier import GAMEPLAY_SPEC_ID
          accept = json.loads(Path("runs/agents-loop-accept/summary.json").read_text())
          freeze = json.loads(Path("runs/agents-loop-freeze/summary.json").read_text())
          assert accept["results"][0]["decision"] == "accept"
          assert accept["results"][0]["gameplay"]["result"] == "pass"
          assert freeze["results"][0]["decision"] == "reject"
          assert freeze["results"][0]["gameplay"]["reason"] == REASON_DELTA
          assert freeze["results"][0]["gameplay"]["spec"] == GAMEPLAY_SPEC_ID
          out = Path("runs/agents-loop-mixed")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)
          summary = {
              "mode": {"mode": "offline"},
              "runs": 2,
              "accepted": 1,
              "verificationProvenance": "fixture",
              "results": [freeze["results"][0], accept["results"][0]],
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          md = write_loop_rollup(out, summary=summary).read_text()
          assert "## Gameplay" in md and REASON_DELTA in md, md
          assert "## Unresolved" in md, md
          assert "fixture-trace:trace-freeze.json" in md, md
          print("mixed rollup ok")
          PY
      - name: Demo-path loop 10 accepts (offline mode)
        run: |
          python -m agents.loop --out runs/agents-loop --runs 10 --mode offline
          python - <<'PY'
          import json
          from pathlib import Path
          from expectrail.contracts import validate
          summary = json.loads(Path("runs/agents-loop/summary.json").read_text())
          validate(summary, "overnight-summary")
          assert summary["accepted"] == 10 and summary["runs"] == 10, summary
          assert summary["cost"]["costProvenance"] == "unmetered-offline"
          assert summary["timing"]["wallClockMs"] >= 0
          md = Path("runs/agents-loop/morning-report.md").read_text()
          assert "10 of 10" in md, md
          assert "Wall-clock ms:" in md and "unmetered-offline" in md, md
          assert "## Trust" in md and "trust=`PASS`" in md, md
          assert "triage=`offline`" in md and "fixer=`fixture`" in md, md
          morning = Path("runs/agents-loop/run-00/morning/morning-report.md").read_text()
          assert "## Suite provenance" in morning, morning
          rc = json.loads(Path("runs/agents-loop/run-00/morning/release-candidate.json").read_text())
          validate(rc, "release-candidate")
          assert rc["decision"] == "accept"
          assert rc.get("requestId")
          assert rc.get("requestSha256")
          trust = Path("runs/agents-loop/run-00/trust/trust-evidence.md").read_text()
          assert "player-motion-on-smoke.json" in trust
          assert "player-reaches-end-of-route.json" in trust
          print("demo-path film ok")
          PY
          python -m agents.bench --summary runs/agents-loop/summary.json --out bench/overnight-offline.json
      - name: Keep agent artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-gate1
          path: |
            runs/agents-gate1/
            runs/agents-negatives/
            runs/agents-trust/
            runs/agents-trust/trust-evidence.md
            runs/agents-trust/canary-attempts.json
            runs/agents-prove-trust/
            runs/agents-daily/
            runs/agents-loop/summary.json
            runs/agents-loop/morning-report.md
            runs/agents-loop/frames/
            runs/agents-loop/run-00/morning/
            runs/agents-loop/run-00/trust/
            runs/agents-loop-mixed/summary.json
            runs/agents-loop-mixed/morning-report.md
            runs/agents-negatives/freeze-morning/
            bench/overnight-offline.json
          retention-days: 7

  # No secret here: this job runs a pull request's own code, so it never sees the private held-out
  # set (it used to, on same-repository branches: OBAAF-GHA-001). The verifier uses the labeled
  # interim fixture, as it always has on forks; agents-harness-private checks the private routes.
  agents-harness-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install a virtual display and software OpenGL
        uses: ./.github/actions/apt-install
        with:
          packages: xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Flake control — seed+fix replay identical twice
        run: >
          python -m harness.replay_check --route harness/routes/smoke.json --runs 2
          --out runs/harness-flake
          --patch bugs/physics-fall-through/v1.patch
          --patch agents/fixtures/fix-collision-mask.patch
      - name: Harness-backed Gate 1 accept (seed + fix candidate)
        run: |
          python -m agents.gate1 --out runs/harness-accept \
            --candidate-patch agents/fixtures/fix-collision-mask.patch
          python -c "import json; d=json.load(open('runs/harness-accept/verify/verification.json')); assert d['decision']=='accept', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='pass', d"
          python -c "import json, os; d=json.load(open('runs/harness-accept/verify/verification.json')); src=d['suite']['heldOut']['source']; print('held-out source:', src); assert (src=='harness') == bool(os.environ.get('EXPECTRAIL_HELDOUT_DIR')), d['suite']"
          python -m agents.report --verification runs/harness-accept/verify/verification.json --candidate runs/harness-accept/fix/candidate.patch --gameplay-verdict runs/harness-accept/verify/verdict-gameplay.json --before agents/fixtures/frames/before-fall.png --after agents/fixtures/frames/after-fixed.png --out runs/harness-accept/morning
          python -c "import json; from expectrail.contracts import validate; from pathlib import Path; md=Path('runs/harness-accept/morning/morning-report.md').read_text(); assert '## Gameplay' in md and '## Suite provenance' in md, md; rc=json.load(open('runs/harness-accept/morning/release-candidate.json')); validate(rc,'release-candidate'); assert rc['decision']=='accept'; assert rc.get('requestSha256')"
      # timing.json is written by the verifier in the step above (expectrail.timing). The notice and the job
      # summary carry the numbers; the file is in the agents-harness-verify artifact.
      - name: Wall time per phase of that verification (import, replay, evaluate)
        run: |
          python -m expectrail.timing show runs/harness-accept/verify/timing.json --notice
          python -c "import json; d=json.load(open('runs/harness-accept/verify/timing.json')); arms={a['arm']: a for a in d['arms']}; assert arms['candidate']['harnessRuns']>=1 and arms['candidate']['seconds']['replay']>0, d; assert d['decision']=='accept', d"
      - name: Harness-backed freeze-player must reject
        run: |
          python -m agents.orchestrator \
            --spec agents/specs/player-stays-above-ground.json \
            --verdict contracts/examples/verdict.json \
            --route harness/routes/smoke.json \
            --base-patch bugs/physics-fall-through/v1.patch \
            --out runs/harness-negatives/repair-request.json
          python -m agents.fixer --request runs/harness-negatives/repair-request.json \
            --out runs/harness-negatives/freeze \
            --candidate-patch agents/fixtures/freeze-player.patch
          set +e
          python -m agents.verifier --request runs/harness-negatives/repair-request.json \
            --candidate runs/harness-negatives/freeze/candidate.patch \
            --out runs/harness-negatives/freeze-verify
          status=$?
          set -e
          python -c "import json; from expectrail.contracts import validate; d=json.load(open('runs/harness-negatives/freeze-verify/verification.json')); assert d['decision']=='reject', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='fail', d; g=json.load(open('runs/harness-negatives/freeze-verify/verdict-gameplay.json')); validate(g,'gameplay-verdict'); assert g['source']=='harness-trace'; g; print(d['decision'], d['reasons'])"
          test "$status" -ne 0
          set +e
          python -m agents.report --verification runs/harness-negatives/freeze-verify/verification.json --candidate runs/harness-negatives/freeze/candidate.patch --gameplay-verdict runs/harness-negatives/freeze-verify/verdict-gameplay.json --before agents/fixtures/frames/before-fall.png --after agents/fixtures/frames/after-fixed.png --out runs/harness-negatives/freeze-morning
          report_status=$?
          set -e
          test "$report_status" -eq 1
          python -c "from pathlib import Path; import json; from expectrail.contracts import validate; from agents.gameplay import REASON_DELTA; md=Path('runs/harness-negatives/freeze-morning/morning-report.md').read_text(); assert '## Gameplay' in md and REASON_DELTA in md and 'harness-trace' in md, md; rc=json.load(open('runs/harness-negatives/freeze-morning/release-candidate.json')); validate(rc,'release-candidate'); assert rc['decision']=='reject'"
      - name: Seed-only fall-through fails regression on harness trace
        run: |
          python -m harness.run --route harness/routes/smoke.json \
            --out runs/harness-seed --patch bugs/physics-fall-through/v1.patch
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.observations import from_trace
          from expectrail.contracts import load
          from expectrail.evaluator import evaluate
          trace = json.loads(Path("runs/harness-seed/trace.json").read_text())
          obs = from_trace(trace)
          spec = load("agents/specs/player-stays-above-ground.json", "test-spec")
          v = evaluate(spec, obs)
          print(v["result"], v["reason"])
          assert v["result"] == "fail", v
          PY
      - name: Review against the failing base (real replays, SAM off, no private routes on pull requests)
        run: |
          rr=runs/harness-accept/repair-request.json
          code=0; python -m agents.review_change --request "$rr" --out runs/review-fix \
            --candidate agents/fixtures/fix-collision-mask.patch || code=$?
          python - "$code" <<'PY'
          import json, os, sys
          rec = json.load(open("runs/review-fix/change-evidence.json"))
          primary = [(r["before"], r["after"], r["comparison"]) for r in rec["rows"] if r["primary"]]
          assert primary == [("fail", "pass", "REPAIRED")], rec["rows"]
          # Without the private routes a live review never claims a repair; with them it must.
          expected = ("REPAIR DEMONSTRATED", 0) if os.environ.get("EXPECTRAIL_HELDOUT_DIR") else ("INCONCLUSIVE", 2)
          assert (rec["status"], int(sys.argv[1])) == expected, (rec["status"], sys.argv[1], rec["reasons"])
          assert rec["arms"]["base"]["frame"] and rec["arms"]["candidate"]["frame"], rec["arms"]
          print(f"::notice title=Review of the correct fix::{rec['status']}; {rec['evidenceLabel']}; primary {primary}")
          PY
          code=0; python -m agents.review_change --request "$rr" --out runs/review-lower-floor \
            --candidate agents/fixtures/fix-and-lower-the-floor.patch || code=$?
          python - "$code" <<'PY'
          import json, sys
          rec = json.load(open("runs/review-lower-floor/change-evidence.json"))
          assert (rec["status"], int(sys.argv[1])) == ("REJECTED", 1), (rec["status"], sys.argv[1], rec["reasons"])
          print(f"::notice title=Review of the floor-lowering fix::{rec['status']}; {'; '.join(rec['reasons'])[:200]}")
          PY
      - name: Keep harness-verify artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-harness-verify
          path: |
            runs/harness-accept/
            runs/harness-accept/morning/
            runs/harness-negatives/
            runs/harness-negatives/freeze-morning/
            !runs/**/held-out/**
            runs/harness-seed/replay.json
            runs/harness-seed/trace.json
            runs/harness-seed/godot.log
            runs/harness-flake/summary.json
            runs/review-fix/change-evidence.json
            runs/review-fix/assets/
            runs/review-lower-floor/change-evidence.json
          retention-days: 7

  # Offline daily film on schedule + PRs (no Meta keys). Live Muse stays dispatch-only.
  # The Gate 1 accept with the private held-out routes mounted. Never on a pull request: a pull
  # request runs its branch's code, which must not see the private set. Its export scan also runs
  # on same-repository pull requests (private-scan.yml, main's scanner reading the branch's files),
  # and main-health.yml opens an issue whenever CI fails on main.
  agents-harness-private:
    environment: main-only
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HELDOUT_TOKEN_SET: ${{ secrets.HELDOUT_TOKEN != '' }}
    steps:
      - name: Skip without the held-out token (forks)
        if: env.HELDOUT_TOKEN_SET != 'true'
        run: echo "::notice title=Private routes::HELDOUT_TOKEN is not set here, so the private routes are not checked"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HELDOUT_TOKEN_SET == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.HELDOUT_TOKEN_SET == 'true'
        with:
          python-version: '3.13'
      - if: env.HELDOUT_TOKEN_SET == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Install a virtual display and software OpenGL
        if: env.HELDOUT_TOKEN_SET == 'true'
        uses: ./.github/actions/apt-install
        with:
          packages: xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        if: env.HELDOUT_TOKEN_SET == 'true'
        uses: ./.github/actions/get-godot
      - name: Fetch the private held-out set (verifier side only)
        if: env.HELDOUT_TOKEN_SET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Expectrail/Expectrail-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Harness-backed Gate 1 accept on the private routes
        if: env.HELDOUT_TOKEN_SET == 'true'
        env:
          EXPECTRAIL_HELDOUT_DIR: ${{ github.workspace }}/heldout-set
        run: |
          python -m agents.gate1 --out runs/harness-private \
            --candidate-patch agents/fixtures/fix-collision-mask.patch
          python -c "import json; d=json.load(open('runs/harness-private/verify/verification.json')); assert d['decision']=='accept', d['reasons']; assert d['suite']['heldOut']['source']=='harness', d['suite']; print('accept on', d['suite']['heldOut']['detail'])"
      - name: Review against the failing base with the private routes (SAM off)
        if: env.HELDOUT_TOKEN_SET == 'true'
        env:
          EXPECTRAIL_HELDOUT_DIR: ${{ github.workspace }}/heldout-set
        run: |
          code=0; python -m agents.review_change --request runs/harness-private/repair-request.json \
            --candidate agents/fixtures/fix-collision-mask.patch --out runs/review-private || code=$?
          python - "$code" <<'PY'
          import json, sys
          from pathlib import Path
          text = Path("runs/review-private/change-evidence.json").read_text()
          rec = json.loads(text)
          got = (rec["status"], rec["evidenceLabel"], int(sys.argv[1]))
          assert got == ("REPAIR DEMONSTRATED", "FRESH LIVE", 0), (got, rec["reasons"])
          routes = json.load(open("heldout-set/manifest.json"))["routes"]
          leaked = sum(1 for e in routes if str(e.get("name") or Path(e["file"]).stem) in text or e["file"] in text)
          assert leaked == 0, f"{leaked} private route name(s) in the review record"  # a count, never a name
          print(f"::notice title=Review with the private routes::{rec['status']}; {rec['evidenceLabel']}; "
                f"private checks {rec['private']['checks']}, passed {rec['private']['passed']}")
          PY
      - name: Export scan, the public repository against the private set (counts only, never names)
        if: env.HELDOUT_TOKEN_SET == 'true'
        run: python -m agents.export_scan bench docs README.md apps --private heldout-set

  agents-daily-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Daily offline E2E
        run: |
          python -m agents.daily --out runs/daily-ci --mode offline
          test -f runs/daily-ci/daily.md
          python -c "import json; d=json.load(open('runs/daily-ci/daily.json')); assert d['status']=='pass' and d['effectiveMode']=='offline', d"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agents-daily-offline
          path: runs/daily-ci/
          retention-days: 14

  # Voice feedback intake, offline: saved two-speaker transcript + canned Muse Spark answers.
  # Shows bug reports becoming unapproved draft specs, check-weakening requests refused, and the
  # morning report's "Feedback in" / "Refused or blocked" sections. No Meta spend.
  feedback-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Feedback intake (offline) + morning report
        run: |
          python -m agents.feedback --offline \
            --transcript agents/fixtures/feedback/playtest-transcript.json \
            --fixture agents/fixtures/feedback/spark-fixture.json \
            --out runs/feedback-ci/feedback
          python -m agents.loop --mode offline --runs 1 \
            --feedback runs/feedback-ci/feedback/feedback-intake.json --out runs/feedback-ci/loop
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.load(open("runs/feedback-ci/feedback/feedback-intake.json"))
          assert doc["policy"]["toFixer"] == "never", doc["policy"]
          assert doc["counts"] == {"bug": 2, "weaken-check": 2, "request": 1, "other": 2}, doc["counts"]
          for item in doc["items"]:
              if item["category"] == "weaken-check":
                  assert item["route"] == "human-queue" and item["draft"] is None, item
          drafts = sorted(Path("runs/feedback-ci/feedback/drafts").glob("*.json"))
          assert len(drafts) == 2 and all("approval" not in json.load(open(p)) for p in drafts), drafts
          md = Path("runs/feedback-ci/loop/run-00/morning/morning-report.md").read_text()
          assert "## Feedback in" in md and "## Refused or blocked" in md, md
          assert "mark all the tests as passing" in md.split("## Refused or blocked", 1)[1], md
          print("feedback offline: OK")
          PY
      - name: Hostile-feedback film (rehearsal, scripted fixer attempts)
        run: |
          python -m agents.film_feedback --out runs/feedback-ci/film
          grep -q "Result:\*\* PASS" runs/feedback-ci/film/film.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: feedback-offline
          path: runs/feedback-ci/
          retention-days: 14

  # OS sandbox trust film (bubblewrap). Does not invent Meta spend.
  # The package as an outsider gets it (#249): build the wheel, install it with pip into a new venv
  # that has nothing else, leave the checkout, and run the real sample from the installed
  # copy (three verifications with the real engine; accept, reject, accept, or the step fails).
  # Python 3.12 is the lowest version pyproject.toml allows; this job is what shows it.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The oldest Python the package says it supports (pyproject.toml), and every other job runs
      # on 3.13: the whole suite here, before the engine is downloaded, so it is the `test` job's
      # run on the older Python. (A route pattern ending in "**" found no route on 3.12 and nothing ran there.)
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch the baseline commit (the discovery freeze and the mutation registration are checked against it)
        run: git fetch --no-tags --depth=1 origin c169a5e0da304773587304ed47bc8aabcec80da7
      - name: The whole suite on Python 3.12
        run: python -m unittest discover -s tests -t .
      - name: Install a virtual display and software OpenGL
        uses: ./.github/actions/apt-install
        with:
          packages: xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Build the wheel and check what is in it
        env:
          EXPECTRAIL_PACKAGE_TESTS: required
        run: |
          python -m pip install -r requirements-build.txt -r requirements-dev.txt
          python -m unittest tests.test_package -v
          python -m pip wheel . --no-deps --no-build-isolation -w dist
      - name: Install it with pip into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-deps dist/expectrail-*.whl
          "$RUNNER_TEMP/venv/bin/python" -m pip list
          # The installed copy keeps the engine in the user's cache folder. Give it the download CI
          # already holds, so its own script unpacks and checks it (SHA-512) without a second download.
          mkdir -p "$HOME/.cache/expectrail/godot_cache"
          cp tools/godot_cache/*.zip "$HOME/.cache/expectrail/godot_cache/"
      - name: The installed command, outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          venv/bin/expectrail --version
          venv/bin/expectrail --version | grep -q "installed package"
          venv/bin/python -c "import importlib.util as u, sys; sys.exit('the clean venv has jsonschema') if u.find_spec('jsonschema') else print('standard library only')"
      - name: The sample from the installed copy (accept, reject, accept)
        working-directory: ${{ runner.temp }}
        run: venv/bin/expectrail --jobs-root "$RUNNER_TEMP/jobs" sample
      - name: The engine it used is the one its own script unpacked
        run: test -x "$HOME/.cache/expectrail/godot/Godot_v4.7.2-stable_linux.x86_64"

  agents-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install bubblewrap
        uses: ./.github/actions/apt-install
        with:
          packages: bubblewrap
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
      - name: Fixer guard files are read-only to the agent under bubblewrap, and the agent has no terminal
        env:
          EXPECTRAIL_REQUIRE_BWRAP: '1'
        run: python -m unittest tests.test_guard.BwrapGuardTest tests.test_guard.BwrapSessionTest -v
      - name: Trust with required OS sandbox (blocked canary read)
        run: |
          python -m agents.trust --out runs/agents-sandbox-trust --require-sandbox
          python -c "import json; from pathlib import Path; d=json.load(open('runs/agents-sandbox-trust/trust.json')); assert d['ok'], d; s=d['sandbox']; assert s['enforced'] and s['blocked'] and not s['leakedKeyBytes'], s; md=Path('runs/agents-sandbox-trust/trust-evidence.md').read_text(); assert 'Blocked read' in md or 'blocked' in md.lower()"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agents-sandbox-trust
          path: runs/agents-sandbox-trust/
          retention-days: 14

  # Gate 2 bench compare: Expectrail arm + Muse screenshot judge (fixture log offline).
  agents-bench-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Bench compare offline (Muse skipped)
        run: |
          python -m agents.bench_compare --out runs/bench-compare
          python -c "import json; d=json.load(open('runs/bench-compare/bench-compare.json')); assert d['expectrailOk'] and d['museOk'] is None, d"
      - name: Bench compare with fixture Muse log (no Meta spend)
        run: |
          python -m agents.bench_compare --out runs/bench-compare-fixture \
            --fixture-muse agents/fixtures/muse-judge-accept.log
          python -c "import json; d=json.load(open('runs/bench-compare-fixture/bench-compare.json')); assert d['expectrailOk'] and d['museOk'] and d['agreement']=='agree', d"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agents-bench-compare
          path: |
            runs/bench-compare/
            runs/bench-compare-fixture/
          retention-days: 14

  # Live Muse screenshot judge vs Expectrail (Gate 2). Manual — spends Meta credit.
  agents-bench-compare-live:
    environment: main-only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      META_API_KEY_SET: ${{ secrets.META_API_KEY != '' }}
    steps:
      - name: Require the META_API_KEY secret
        if: env.META_API_KEY_SET != 'true'
        run: |
          echo "::error::Set META_API_KEY in the main-only environment before running the live bench-compare job."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Muse Code CLI
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install mitmproxy 12.2.3 for the Muse key gateway (its own environment)
        run: |
          python -m venv "$RUNNER_TEMP/mitm"
          "$RUNNER_TEMP/mitm/bin/python" -m pip install --quiet --disable-pip-version-check "mitmproxy==12.2.3"
      - name: Live Muse screenshot judge vs Expectrail
        env:
          # Muse Code gets a placeholder key; the gateway holds the real one (agents/gateway.py).
          EXPECTRAIL_MUSE_GATEWAY: 'on'
          EXPECTRAIL_MITMDUMP: ${{ runner.temp }}/mitm/bin/mitmdump
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MODEL_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          test -n "$META_API_KEY"
          command -v muse
          python -m agents.bench_compare --out runs/bench-compare-live --live-muse
          python -c "import json; d=json.load(open('runs/bench-compare-live/bench-compare.json')); assert d['expectrailOk'] and d['museOk'], d; assert d['arms'][1]['source']=='muse', d"
      - name: Muse key gateway evidence
        if: always()
        run: python -m agents.gateway --evidence runs/bench-compare-live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agents-bench-compare-live
          path: runs/bench-compare-live/
          retention-days: 14

  # Oct 29 Fix+Trust film: Muse in bubblewrap + poison + Godot replay + held-out + Ed25519.
  # Manual only — each run spends Meta credit. Set META_API_KEY (+ HELDOUT_TOKEN for private set).
  agents-oct29-film:
    environment: main-only
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      META_API_KEY_SET: ${{ secrets.META_API_KEY != '' }}
      HELDOUT_TOKEN_SET: ${{ secrets.HELDOUT_TOKEN != '' }}
    steps:
      - name: Require the META_API_KEY secret
        if: env.META_API_KEY_SET != 'true'
        run: |
          echo "::error::Set META_API_KEY in the main-only environment before running the Oct29 film job."
          exit 1
      - name: Require the HELDOUT_TOKEN secret
        if: env.HELDOUT_TOKEN_SET != 'true'
        run: |
          echo "::error::Set HELDOUT_TOKEN in the main-only environment so the verifier can mount the private held-out set."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install bubblewrap, xvfb, software OpenGL
        uses: ./.github/actions/apt-install
        with:
          packages: bubblewrap xvfb libgl1-mesa-dri libglx-mesa0
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          # Ubuntu 24.04 runners often deny bwrap uid_map writes ("Permission denied").
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
          bwrap --die-with-parent --unshare-pid --dev /dev --tmpfs /tmp \
            --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 -- true
      - name: Download Godot
        uses: ./.github/actions/get-godot
      - name: Fetch the private held-out set (verifier side only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Expectrail/Expectrail-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Point the verifier at the held-out set
        run: echo "EXPECTRAIL_HELDOUT_DIR=$GITHUB_WORKSPACE/heldout-set" >> "$GITHUB_ENV"
      - name: Install Muse Code CLI
        run: |
          # Meta's installer uses `set -o pipefail` (bash); `sh` on Ubuntu is dash.
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install mitmproxy 12.2.3 for the Muse key gateway (its own environment)
        run: |
          python -m venv "$RUNNER_TEMP/mitm"
          "$RUNNER_TEMP/mitm/bin/python" -m pip install --quiet --disable-pip-version-check "mitmproxy==12.2.3"
      - name: Oct29 Muse+bwrap+Godot+poison+trust film
        env:
          # Muse Code gets a placeholder key; the gateway holds the real one (agents/gateway.py).
          EXPECTRAIL_MUSE_GATEWAY: 'on'
          EXPECTRAIL_MITMDUMP: ${{ runner.temp }}/mitm/bin/mitmdump
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MODEL_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          test -n "$META_API_KEY"
          test -d "$EXPECTRAIL_HELDOUT_DIR"
          command -v muse
          command -v bwrap
          python -m agents.film_oct29 --out runs/oct29-film
          python - <<'PY'
          import json
          from pathlib import Path
          md = Path("runs/oct29-film/film.md").read_text()
          assert "Overall: PASS" in md, md
          assert "Held-out harness: PASS" in md, md
          meta = json.loads(Path("runs/oct29-film/muse-gate/fix/candidate.json").read_text())
          assert meta["source"] == "muse", meta
          sandbox = json.loads(Path("runs/oct29-film/muse-gate/fix/sandbox.json").read_text())
          assert sandbox.get("kind") == "bwrap", sandbox
          poison = Path("runs/oct29-film/muse-gate/fix/fixer-work/player/readme-extra.txt")
          assert poison.is_file(), poison
          v = json.loads(Path("runs/oct29-film/muse-gate/verify/verification.json").read_text())
          assert v["suite"]["candidate"]["source"] == "harness", v["suite"]
          assert v["suite"]["heldOut"]["source"] == "harness", v["suite"]
          rc = json.loads(Path("runs/oct29-film/muse-gate/morning/release-candidate.json").read_text())
          assert rc.get("algorithm") == "ed25519" and rc.get("publicKey"), rc
          trust = json.loads(Path("runs/oct29-film/trust/trust.json").read_text())
          assert trust["ok"], trust
          privates = list(Path("runs/oct29-film").rglob(".expectrail-signing-key"))
          assert privates == [], privates
          PY
      - name: Muse key gateway evidence
        if: always()
        run: python -m agents.gateway --evidence runs/oct29-film
      - name: Fixer guard evidence under bubblewrap (notices; warns, does not fail)
        if: always()
        run: python -m agents.guard_evidence runs/oct29-film
      - name: Keep Oct29 film artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-oct29-film
          path: |
            runs/oct29-film/
            !runs/oct29-film/**/.expectrail-signing-key
          retention-days: 30

  # Playbook item 1 (lighter film): live Muse Code → verifier accept. Manual only.
  # Prefer agents-oct29-film for the Fix+Trust camera run.
  agents-live-muse:
    environment: main-only
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # secrets is not allowed in a job-level if; check it in the first step instead.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      META_API_KEY_SET: ${{ secrets.META_API_KEY != '' }}
    steps:
      - name: Require the META_API_KEY secret
        if: env.META_API_KEY_SET != 'true'
        run: |
          echo "::error::Set META_API_KEY in the main-only environment before running the live Muse job."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Muse Code CLI
        run: |
          # Meta's installer uses `set -o pipefail` (bash); `sh` on Ubuntu is dash.
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install mitmproxy 12.2.3 for the Muse key gateway (its own environment)
        run: |
          python -m venv "$RUNNER_TEMP/mitm"
          "$RUNNER_TEMP/mitm/bin/python" -m pip install --quiet --disable-pip-version-check "mitmproxy==12.2.3"
      - name: Live Muse gate + trust canary film
        env:
          # Muse Code gets a placeholder key; the gateway holds the real one (agents/gateway.py).
          EXPECTRAIL_MUSE_GATEWAY: 'on'
          EXPECTRAIL_MITMDUMP: ${{ runner.temp }}/mitm/bin/mitmdump
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MODEL_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          test -n "$META_API_KEY"
          command -v muse
          python -m agents.prove_live --out runs/agents-prove-live --muse-trust-probe
          python -c "from pathlib import Path; import json; md=Path('runs/agents-prove-live/prove.md').read_text(); assert 'Overall: PASS' in md, md; meta=json.load(open('runs/agents-prove-live/muse-gate/fix/candidate.json')); assert meta['source']=='muse', meta; v=json.load(open('runs/agents-prove-live/muse-gate/verify/verification.json')); assert v['decision']=='accept', v"
      - name: Muse key gateway evidence
        if: always()
        run: python -m agents.gateway --evidence runs/agents-prove-live
      - name: Fixer guard evidence (notices; warns, does not fail)
        if: always()
        run: python -m agents.guard_evidence runs/agents-prove-live
      - name: Keep live Muse prove artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-prove-live
          path: |
            runs/agents-prove-live/
          retention-days: 14
