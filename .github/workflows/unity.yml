# Unity: build Platformio (game/unity-platformer) with a Unity licence, then replay the player on a
# machine that has none. Modelled on ci.yml's capture-smoke job.
#
# The build job runs in the `unity` GitHub Environment, which holds the only secrets this workflow
# uses (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD) and which Sean sets up to need his approval for
# every run. Without those secrets the job prints a notice, builds nothing and succeeds; the replay
# job is then skipped. Unity Personal can only be activated online, so the builder uses GameCI's v4
# flow (the licence file plus the account's email and password) and no other activation route.
#
# Because every run waits for that approval, this workflow runs only when dispatched, or on a pull
# request that touches the Unity game, the Unity harness, a Unity route or this file.
#
# Builds, one Editor at a time, in this order:
#   1. the clean game, with GameCI's own build method and no harness (this proves the build works);
#   2. the clean game with the harness package (harness/unity/package), the player the replays use;
#   3. the clean game with the harness and the environment canary (harness/unity/fixtures), run here
#      once and never uploaded.
#   No seeded Unity bug exists yet, and a candidate fix from the fixer is never built here.
# The Library cache is restored for the clean build and saved only from it, on main; builds 2 and 3
# start from a copy of build 1's Library and never write the cache.
name: Unity

on:
  pull_request:
    paths:
      - 'game/unity-platformer/**'
      - 'harness/unity/**'
      - 'harness/routes/unity-*.json'
      - '.github/workflows/unity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: unity
    # Unity's terms allow one running Editor per seat, so one build at a time across the repository.
    # GitHub keeps one run waiting in a group: a third run cancels the one already waiting.
    concurrency:
      group: unity-editor-seat
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      built: ${{ steps.done.outputs.built }}
      clean-build: ${{ steps.clean-time.outputs.summary }}
      harness-build: ${{ steps.harness-time.outputs.summary }}
      canary-build: ${{ steps.canary-time.outputs.summary }}
    env:
      UNITY_LICENSE_SET: ${{ secrets.UNITY_LICENSE != '' }}
      UNITY_EMAIL_SET: ${{ secrets.UNITY_EMAIL != '' }}
      UNITY_PASSWORD_SET: ${{ secrets.UNITY_PASSWORD != '' }}
      # The project's editor (ProjectSettings/ProjectVersion.txt) and GameCI's image for it.
      UNITY_VERSION: 6000.3.21f1
      UNITY_IMAGE: unityci/editor:ubuntu-6000.3.21f1-linux-il2cpp-3
    steps:
      - name: Skip without the Unity licence secrets
        id: secrets
        run: |
          present=0
          for set in "$UNITY_LICENSE_SET" "$UNITY_EMAIL_SET" "$UNITY_PASSWORD_SET"; do
            if [ "$set" = "true" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 3 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$present" -eq 0 ]; then
            echo "::notice title=Unity build skipped::The unity environment has no UNITY_LICENSE, UNITY_EMAIL or UNITY_PASSWORD secret, so no Unity player was built or replayed and nothing was checked."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Unity licence secrets::$present of the 3 secrets (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD) are set in the unity environment; set all three or none."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.secrets.outputs.present == 'true'
        with:
          python-version: '3.13'
      - if: steps.secrets.outputs.present == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: The job builds with the project's own editor version
        if: steps.secrets.outputs.present == 'true'
        run: |
          if ! grep -qx "m_EditorVersion: $UNITY_VERSION" game/unity-platformer/ProjectSettings/ProjectVersion.txt; then
            echo "::error title=Unity version::the project is not on $UNITY_VERSION: $(head -n 1 game/unity-platformer/ProjectSettings/ProjectVersion.txt)"
            exit 1
          fi
      - name: Free disk space for the editor image
        if: steps.secrets.outputs.present == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Pull the editor image before activating, and record its digest
        if: steps.secrets.outputs.present == 'true'
        run: |
          docker pull --quiet "$UNITY_IMAGE"
          digest=$(docker image inspect --format '{{join .RepoDigests ","}}' "$UNITY_IMAGE")
          echo "::notice title=Unity editor image::$UNITY_IMAGE ($digest)"
      # Every project is a copy, so the checkout stays as committed: GameCI adds its build script to
      # the project it builds, the Editor writes Library/ there, and the build keys hash the checkout.
      - name: Lay out the harness and canary projects (before any build touches the workspace)
        if: steps.secrets.outputs.present == 'true'
        run: |
          python -m harness.unity.run --prepare-build --out runs/unity/harness
          python -m harness.unity.run --prepare-build --out runs/unity/canary --patch harness/unity/fixtures/canary-env.patch
      - name: Copy the clean game to build it
        if: steps.secrets.outputs.present == 'true'
        run: |
          mkdir -p runs/unity/clean
          cp -a game/unity-platformer runs/unity/clean/project
      - name: Library cache key (the clean game's Assets, Packages and ProjectSettings)
        if: steps.secrets.outputs.present == 'true'
        id: key
        env:
          KEY: unity-library-StandaloneLinux64-${{ hashFiles('game/unity-platformer/Assets/**', 'game/unity-platformer/Packages/**', 'game/unity-platformer/ProjectSettings/**') }}
        run: echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Restore the Library cache
        if: steps.secrets.outputs.present == 'true'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runs/unity/clean/project/Library
          key: ${{ steps.key.outputs.key }}
          restore-keys: unity-library-StandaloneLinux64-
      - name: Start the build clock
        if: steps.secrets.outputs.present == 'true'
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build the clean game (GameCI's build method, no harness)
        if: steps.secrets.outputs.present == 'true'
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: runs/unity/clean/project
          targetPlatform: StandaloneLinux64
          unityVersion: 6000.3.21f1
          customImage: unityci/editor:ubuntu-6000.3.21f1-linux-il2cpp-3
          buildsPath: runs/unity/builds
          buildName: clean
          versioning: None
      - name: Clean build time
        if: steps.secrets.outputs.present == 'true'
        id: clean-time
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          seconds=$(( $(date +%s) - BUILD_START ))
          if [ "$CACHE_HIT" = "true" ]; then kind="warm: Library restored from this exact key"
          elif [ -n "$CACHE_MATCHED" ]; then kind="warm: Library restored from an older key"
          else kind="cold: no Library cache"; fi
          echo "summary=clean game $seconds s ($kind)" >> "$GITHUB_OUTPUT"
          echo "::notice title=Unity build time::clean game, $seconds s ($kind)"
      - name: Own the build output (the builder's container runs as root)
        if: steps.secrets.outputs.present == 'true'
        run: sudo chown -R "$(id -u):$(id -g)" runs/unity
      # Only the clean build on main writes the cache, so no pull request and no patched build can
      # put a Library in front of a later build.
      - name: Save the Library cache (clean build on main only)
        if: steps.secrets.outputs.present == 'true' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runs/unity/clean/project/Library
          key: ${{ steps.key.outputs.key }}
      - name: Keep the clean player
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-player-clean
          path: runs/unity/builds/StandaloneLinux64/
          if-no-files-found: error
          retention-days: 7
      - name: Start the harness build from the clean build's Library
        if: steps.secrets.outputs.present == 'true'
        run: |
          cp -a runs/unity/clean/project/Library runs/unity/harness/project/Library
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build the clean game with the harness
        if: steps.secrets.outputs.present == 'true'
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: runs/unity/harness/project
          targetPlatform: StandaloneLinux64
          unityVersion: 6000.3.21f1
          customImage: unityci/editor:ubuntu-6000.3.21f1-linux-il2cpp-3
          buildMethod: Expectrail.Harness.Editor.HarnessBuild.Build
          buildsPath: runs/unity/builds-unused
          versioning: None
      - name: Harness build time, and the harness is in the player
        if: steps.secrets.outputs.present == 'true'
        id: harness-time
        run: |
          seconds=$(( $(date +%s) - BUILD_START ))
          sudo chown -R "$(id -u):$(id -g)" runs/unity
          test -f runs/unity/harness/player/game_Data/Managed/Expectrail.Harness.dll
          echo "summary=clean game with the harness $seconds s (warm: the clean build's Library)" >> "$GITHUB_OUTPUT"
          echo "::notice title=Unity build time::clean game with the harness, $seconds s (warm: the clean build's Library)"
      - name: Keep the harness player and its build key
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-player-clean-harness
          path: |
            runs/unity/harness/build.json
            runs/unity/harness/player/
          if-no-files-found: error
          retention-days: 7
      # The replay job starts from here: the canary below can fail the job without hiding the replays.
      - name: Built
        if: steps.secrets.outputs.present == 'true'
        id: done
        run: echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Start the canary build from the clean build's Library
        if: steps.secrets.outputs.present == 'true'
        run: |
          cp -a runs/unity/clean/project/Library runs/unity/canary/project/Library
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build the environment canary (the harness and harness/unity/fixtures/canary-env.patch)
        if: steps.secrets.outputs.present == 'true'
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: runs/unity/canary/project
          targetPlatform: StandaloneLinux64
          unityVersion: 6000.3.21f1
          customImage: unityci/editor:ubuntu-6000.3.21f1-linux-il2cpp-3
          buildMethod: Expectrail.Harness.Editor.HarnessBuild.Build
          buildsPath: runs/unity/builds-unused
          versioning: None
      - name: Canary build time
        if: steps.secrets.outputs.present == 'true'
        id: canary-time
        run: |
          seconds=$(( $(date +%s) - BUILD_START ))
          sudo chown -R "$(id -u):$(id -g)" runs/unity
          echo "summary=canary $seconds s (warm: the clean build's Library)" >> "$GITHUB_OUTPUT"
          echo "::notice title=Unity build time::environment canary, $seconds s (warm: the clean build's Library)"
      - name: Install a virtual display and software OpenGL for the canary
        if: steps.secrets.outputs.present == 'true'
        run: |
          # Ubuntu's mirrors can be mid-sync (run 17: 404s, then a Packages.gz of the wrong size):
          # three attempts, a minute apart, each with a fresh index; a download that stalls 60 s fails (run 18:
          # a replay copy sat 23 min in this step on a stalled mirror).
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libgtk-3-0t64 patch; then break; fi
            [ "$attempt" = 3 ] && exit 1
            echo "::warning title=apt::attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
      # Like ci.yml's capture-smoke canary: the patch prints both variables from the game's own C#
      # (PlayerController.Awake). The player is never uploaded.
      - name: A candidate's game code cannot read the verifier's environment
        if: steps.secrets.outputs.present == 'true'
        env:
          EXPECTRAIL_CANARY: canary-${{ github.run_id }}
          EXPECTRAIL_HELDOUT_DIR: /canary/private/path
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          LP_NATIVE_VECTOR_WIDTH: '128'
          LP_NUM_THREADS: '4'
        run: |
          chmod +x runs/unity/canary/player/game.x86_64
          python -m harness.unity.run --route harness/routes/unity-smoke.json --out runs/unity/canary-run \
            --player runs/unity/canary --patch harness/unity/fixtures/canary-env.patch --no-frames
          grep -qx "CANARY_ENV=" runs/unity/canary-run/unity.log
          grep -qx "CANARY_HELDOUT=" runs/unity/canary-run/unity.log
          if grep -q -e "$EXPECTRAIL_CANARY" -e "/canary/private/path" runs/unity/canary-run/unity.log; then
            echo "::error::the patched game read the verifier's environment"; exit 1
          fi
          echo "::notice title=Unity environment canary::the patched game printed both variables empty"

  # No Unity licence here: the harness player runs in a pinned Ubuntu container on Mesa's llvmpipe, as
  # the Godot harness does (Dockerfile.harness), with llvmpipe's vector width and thread count fixed.
  # It replays the smoke route twice and requires the two to match frame for frame and in the trace.
  replay:
    needs: build
    # Once the harness player is uploaded, even if the canary after it failed the build job.
    if: always() && needs.build.outputs.built == 'true'
    # Two copies, each on its own runner, replay the same player: cross-runner checks they agree.
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      # ubuntu:noble-20261024.1, by digest (docker-library/repo-info, Nov 9, 2026)
      image: ubuntu:noble-20261024.1@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    env:
      DEBIAN_FRONTEND: noninteractive
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      LP_NATIVE_VECTOR_WIDTH: '128'
      LP_NUM_THREADS: '4'
      # One instruction set for llvmpipe on every runner (harness/unity/run.py, RENDER_DEFAULTS).
      GALLIUM_OVERRIDE_CPU_CAPS: sse4.1
    steps:
      - name: Install a virtual display, software OpenGL and the player's libraries
        run: |
          packages="ca-certificates git python3 python3-jsonschema patch xvfb xauth libgl1 libgl1-mesa-dri libglx-mesa0 libegl1
            libx11-6 libxcursor1 libxrandr2 libxi6 libxinerama1 libxext6 libxrender1 libxss1 libgtk-3-0t64 libasound2t64
            libfontconfig1 libfreetype6 libudev1"
          # Ubuntu's mirrors can be mid-sync (run 17: 404s, then a Packages.gz of the wrong size):
          # three attempts, a minute apart, each with a fresh index; a download that stalls 60 s fails (run 18:
          # a replay copy sat 23 min in this step on a stalled mirror).
          for attempt in 1 2 3; do
            if apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update && apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends $packages; then break; fi
            [ "$attempt" = 3 ] && exit 1
            echo "::warning title=apt::attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unity-player-clean-harness
          path: runs/unity/players/harness
      - name: Record the machine
        run: |
          cpu=$(grep -m 1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')
          mesa=$(dpkg-query -W -f '${Version}' libgl1-mesa-dri)
          echo "::notice title=Unity replay machine::CPU $cpu; $(nproc) CPUs; Mesa $mesa; LP_NUM_THREADS=$LP_NUM_THREADS, LP_NATIVE_VECTOR_WIDTH=$LP_NATIVE_VECTOR_WIDTH, GALLIUM_OVERRIDE_CPU_CAPS=$GALLIUM_OVERRIDE_CPU_CAPS"
          mkdir -p runs/unity/replay
          echo "copy ${{ matrix.copy }}: CPU $cpu; $(nproc) CPUs; Mesa $mesa" > runs/unity/replay/machine.txt
      - name: The player has its libraries
        run: |
          dir=runs/unity/players/harness/player
          chmod +x "$dir/game.x86_64"   # artifacts do not keep the executable bit
          if ldd "$dir/UnityPlayer.so" | grep 'not found'; then
            echo "::error title=Unity player libraries::UnityPlayer.so needs libraries this container lacks (above)"
            exit 1
          fi
      - name: Replay the smoke route twice
        id: replays
        run: |
          times=""
          for i in 0 1; do
            start=$(date +%s)
            python3 -m harness.unity.run --route harness/routes/unity-smoke.json --out "runs/unity/replay/run-0$i" \
              --player runs/unity/players/harness
            times="$times $(( $(date +%s) - start ))"
          done
          echo "seconds=${times# }" >> "$GITHUB_OUTPUT"
      - name: The two replays match frame for frame and in the trace
        run: |
          python3 -m harness.unity.run --out runs/unity/replay/run-00 --compare runs/unity/replay/run-01 \
            | tee runs/unity/replay/compare.json
          python3 - <<'PY'
          import json
          r = json.load(open("runs/unity/replay/run-00/replay.json"))
          print(f"::notice title=Unity determinism::2 of 2 replays identical: {r['capture']['frames']} frames "
                f"(frameSha256) and the trace (sha256 {r['trace']['sha256'][:12]}); {r['engine']['renderer']}")
          PY
      - name: What the trace says about the level and the run
        if: always() && steps.replays.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from agents.observations import surface_under
          from harness.unity.run import visible_boxes
          root = Path("runs/unity/replay/run-00")
          trace, run, replay = (json.loads((root / n).read_text()) for n in ("trace.json", "run.json", "replay.json"))
          rows = [r for r in trace["rows"] if r.get("player")]
          surfaces = trace.get("levelSurfaces") or []
          # ground comes from the tile cells; the verifier's search reads the collider paths instead.
          pairs = [(r["ground"], surface_under(surfaces, *r["player"])) for r in rows if "ground" in r]
          agree = sum(1 for a, b in pairs if b is not None and abs(a - b) <= 1.0)
          # Where they disagree: the Godot-tuned search found no surface, or found one at another height.
          missing = sum(1 for a, b in pairs if b is None)
          off = sorted(round(b - a, 1) for a, b in pairs if b is not None and abs(a - b) > 1.0)
          spread = f"collider minus tiles {off[0]} to {off[-1]} px, median {off[len(off) // 2]}" if off else "none"
          print(f"::notice title=Unity ground disagreement::{missing} rows with no collider surface found under the "
                f"player; {len(off)} rows at another height ({spread})")
          player = visible_boxes(trace, "player")
          print(f"::notice title=Unity level::{', '.join(run.get('groundTilemaps') or []) or 'no ground tilemap'}; "
                f"{len(surfaces)} surface polygons; ground on {len(pairs)} of {len(rows)} rows, "
                f"within 1 px of the collider paths on {agree}; player visible in "
                f"{sum(1 for b in player.values() if b)} of {len(player)} frames")
          print(f"::notice title=Unity run::settled after {replay['settle']['ticks']} ticks "
                f"({replay['settle']['frozenFrames']} held frames); {len(replay['hazards'])} hazards "
                f"({', '.join(sorted({h['kind'] for h in replay['hazards']}))}); "
                f"{replay['integrity']['exceptions']} exceptions and {replay['integrity']['errors']} errors logged")
          if not surfaces or not pairs:
              print("::error title=Unity level::the trace has no level surfaces or no ground line, so the ground spec would be needs-review")
              raise SystemExit(1)
          PY
      - name: Calibration of the Unity checks on the clean trace
        if: always() && steps.replays.outcome == 'success'
        run: |
          line=$(python3 -m agents.unity_observations calibrate runs/unity/replay/run-00/trace.json)
          echo "::notice title=Unity calibration::$line"
      - name: Times
        if: always()
        env:
          CLEAN_BUILD: ${{ needs.build.outputs.clean-build }}
          HARNESS_BUILD: ${{ needs.build.outputs.harness-build }}
          CANARY_BUILD: ${{ needs.build.outputs.canary-build }}
          REPLAY_SECONDS: ${{ steps.replays.outputs.seconds }}
        run: |
          echo "::notice title=Unity times::build: $CLEAN_BUILD; $HARNESS_BUILD; $CANARY_BUILD. replay of the 200-tick smoke route: ${REPLAY_SECONDS:-not run} s"
      - name: Keep the first replay and both replays' records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-smoke-replay-${{ matrix.copy }}
          path: |
            runs/unity/replay/machine.txt
            runs/unity/replay/run-00/frames/
            runs/unity/replay/run-00/trace.json
            runs/unity/replay/*/replay.json
            runs/unity/replay/*/run.json
            runs/unity/replay/*/unity.log
            runs/unity/replay/compare.json
          if-no-files-found: ignore
          retention-days: 7

  cross-runner:
    # The same player replayed on two runners: Unity runs 8 and 9 gave different trace hashes across runs.
    needs: [build, replay]
    if: always() && needs.build.outputs.built == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: unity-smoke-replay-*
          path: runs/unity/cross
      - name: Pillow, so every differing frame is measured
        # Ubuntu's own package, not PyPI: the comparison fails rather than sample without it.
        run: |
          # Ubuntu's mirrors can be mid-sync (run 17: 404s, then a Packages.gz of the wrong size):
          # three attempts, a minute apart, each with a fresh index; a download that stalls 60 s fails (run 18:
          # a replay copy sat 23 min in this step on a stalled mirror).
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y -qq --no-install-recommends python3-pil; then break; fi
            [ "$attempt" = 3 ] && exit 1
            echo "::warning title=apt::attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
          python3 -c "from harness.unity import png_pixels; assert png_pixels.fast(), 'Pillow did not import'"
      - name: The two runners replayed the route identically
        run: |
          set +e
          out=$(python3 -m harness.unity.trace_diff runs/unity/cross/unity-smoke-replay-a/run-00 \
            runs/unity/cross/unity-smoke-replay-b/run-00 --json runs/unity/cross/diff.json)
          status=$?
          set -e
          echo "$out"
          cat runs/unity/cross/unity-smoke-replay-*/machine.txt
          for c in a b; do
            grep -h "expectrail: hold from tick" "runs/unity/cross/unity-smoke-replay-$c/run-00/unity.log" \
              | sed "s/^/copy $c: /" || echo "copy $c: no hold logged"
          done
          if [ "$status" -eq 0 ]; then
            echo "::notice title=Unity cross-runner::$out"
          else
            echo "::error title=Unity cross-runner::$out"
            python3 -c "import json; d = json.load(open('runs/unity/cross/diff.json')); [print(k, json.dumps(v['first'], default=str)[:600]) for k, v in d['rows']['fields'].items()]; p = d.get('pixels') or {}; print('frames beyond tolerance:', p.get('beyondTolerance')); [print('frame', i, m['differ'], 'of', m['pixels'], 'pixels differ, largest gap', m['largest']) for i, m in sorted(p.get('frames', {}).items(), key=lambda kv: int(kv[0])) if int(i) in (p.get('beyondTolerance') or [])][:20]"
            exit 1
          fi
