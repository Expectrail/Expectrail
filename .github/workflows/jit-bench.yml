name: Generated checks bench

# The known-bugs bench (expectrail/jit/bench.py, bench/jit/known/): the whole live generated-checks
# pipeline on each reported bug with a wrong fix and the correct fix, scored against the bar in
# bench/jit/known/preregistration.json. Refuses to start unless that registration is signed off, every
# file it pins is unchanged, and the run comes from main. Each case's propose and revise jobs run in
# main-only, so each waits for a deployment review like any live run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jit-bench
  cancel-in-progress: false

jobs:
  registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Refuse unless from main, signed off, and every pin holds
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::the bench runs only from main"; exit 1; }
          python -m expectrail.jit.cli bench-check
      - id: cases
        run: echo "cases=$(python -c 'import json; print(json.dumps(json.load(open("bench/jit/known/cases.json"))["cases"]))')" >> "$GITHUB_OUTPUT"

  case:
    needs: registration
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.registration.outputs.cases) }}
    uses: ./.github/workflows/jit.yml
    with:
      mode: live
      case: ${{ matrix.c.case }}
      base_patch: ${{ matrix.c.base }}
      candidate_patch: ${{ matrix.c.candidate }}
      report_file: ${{ matrix.c.report }}
      budget_usd: '2'

  score:
    needs: [registration, case]
    if: always() && needs.registration.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: jit-known-*
          path: runs/artifacts
      - name: Score against the registration
        run: |
          mkdir -p runs/bench
          for d in runs/artifacts/jit-known-*; do
            name="${d#runs/artifacts/jit-}"
            [[ "$name" == *-round1 ]] && continue
            [[ -f "$d/jit-run.json" ]] && mkdir -p "runs/bench/$name" && cp "$d/jit-run.json" "runs/bench/$name/"
          done
          python -m expectrail.jit.cli bench-score --records runs/bench --out runs/bench-score
          cat runs/bench-score/jit-bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-bench
          path: |
            runs/bench-score/
            runs/bench/
          retention-days: 90
