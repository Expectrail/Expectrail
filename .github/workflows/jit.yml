name: Generated checks

# Per-change check generation, report-only (docs/jit.md). For one candidate change, Muse Spark proposes
# checks in the closed trace language from the bug report and the patch; the job keeps only checks
# that pass 3 of 3 on the clean game and fail 3 of 3 on a near miss of the change, runs them on the
# candidate, and records what they catch, strong or weak. Nothing here accepts or rejects a change.
#
# The model key and the change's code never meet: the propose and revise jobs hold the key and only
# read the patch as text; the measure and replay jobs run the game and have no secret. On pull
# requests and in rehearsal mode the proposal is a committed stand-in (bench/jit/rehearsal/), so no
# key and no spend: a rehearsal proves the plumbing and is never a result.
#
# live: one change, from the inputs. bench: the known-bugs bench (expectrail/jit/bench.py), every case
# in bench/jit/known/cases.json through the same jobs, scored against the signed registration. Both
# run each job once per case (a matrix), so the keyed jobs stay in main-only: a called workflow would
# not see the environment's keys (bench run 42923427104).
#
# repro: the public reproduction bench (bench/jit/public, issue #285), from main only. Every defect is
# one case through the same jobs: the defect is the bug, and the candidate is the same for all, one
# comment line in the game's README (bench/jit/public/no-fix.patch), so the checks come from the bug
# build and the report alone. The cases come from the committed bench and nothing typed at dispatch.
# repro-score reads the final records and writes the reproduction rate (expectrail/repro/score.py).
#
# offer (expectrail/jit/offer.py): what the generator is offered, the same in every job of one run and
# written into each proposal and record. baseline, the default, is the generator as it was before
# issue #285's steps 3 and 4; signals-reach also offers the three held-back signals and the reach
# probes; signals-reach-evidence also gives the proposer step 5's evidence, which the measure job makes
# by replaying every probe with frames (repro-evidence.json). The known-bugs bench is registered under
# baseline and refuses any other.
#
# signals-reach-evidence-pixel (#286) also lets the proposer propose pixel checks, about what is drawn, judged
# by SAM 3.1 (expectrail/jit/pixel.py, sam_observer.py). SAM's key and the change's code never meet, so a
# pixel check takes three jobs (expectrail/jit/pixel_jobs.py): replay-final replays each pixel check's probe
# with frames on the clean game, the bug build and the candidate and keeps the frames (no secret);
# pixel-ask asks SAM about the kept frames and runs no game (the key, in main-only, within what the change's
# cap has left); pixel-judge replays the trace checks again and judges the pixel checks from the captured
# frames and SAM's answers (no secret). Under this setting pixel-judge's record is the result.
#
# candidate (#285, step 6): shown, the default, gives the model the candidate patch as text, as before;
# withheld gives it no byte of the candidate (--withhold-candidate on propose, revise and every replay),
# so the checks come from the report and the bug build alone, and repro-score counts only records made
# that way (--candidate withheld). The known-bugs bench is registered with the candidate shown.
#
# sam_every (#286): under the pixel setting, SAM is asked about every Nth frame of a probe and its last
# (10 by default, 1 to 60). The capture, asking and judging jobs all take the same value, so the frames
# kept, asked about and judged are one plan; a job that plans other frames than the answers were asked
# about judges nothing. A sparser plan reserves fewer images under the same cap.
#
# observer (#286): under the pixel setting, who judges the pixel checks. sam-3.1-anchor, the default, is
# the three jobs above. visual-sensor is the no-model template sensor (expectrail/jit/template_observer.py):
# it holds no key and sends nothing, so it judges in replay-final and pixel-ask and pixel-judge do not run.
# Its bank is calibrated once a run by the sensor-bank job, on the clean game alone (four dedicated clean
# routes, no patch), and every case is judged with that one bank. propose and revise are told which
# observer will judge (--observer), so the proposer is offered only what that observer can tell: for the
# sensor, whether and where the player is drawn. sam_every sets the sensor's frame plan too.
on:
  pull_request:
    paths:
      - 'expectrail/jit/**'
      - 'contracts/jit-run.v1.schema.json'
      - 'bench/jit/**'
      - '.github/workflows/jit.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: rehearsal (committed stand-ins, no key), live (one change, Muse Spark), bench (the known-bugs bench, from main) or repro (the public reproduction bench, from main)
        type: choice
        options: ['rehearsal', 'live', 'bench', 'repro']
        default: 'rehearsal'
      case:
        description: A name for this change (letters, digits and dashes); live mode only
        default: ''
      base_patch:
        description: The bug, as a patch under bugs/ (empty for none); live mode only
        default: ''
      candidate_patch:
        description: The candidate change, as a patch under bugs/ or bench/; live mode only
        default: ''
      report_file:
        description: The bug report, a text file under bugs/ or bench/; live mode only
        default: ''
      budget_usd:
        description: Spend cap per change, in US dollars (bench mode uses the registration's)
        default: '2'
      offer:
        description: What the generator is offered (expectrail/jit/offer.py); bench mode takes baseline only
        type: choice
        options: ['baseline', 'signals-reach', 'signals-reach-evidence', 'signals-reach-evidence-pixel']
        default: 'baseline'
      candidate:
        description: Whether the model is shown the candidate patch (shown) or given no byte of it (withheld); bench mode takes shown only
        type: choice
        options: ['shown', 'withheld']
        default: 'shown'
      sam_every:
        description: Pixel setting only. SAM is asked about every Nth frame of a probe and its last (1 to 60; 10 by default)
        default: '10'
      observer:
        description: Pixel setting only. Who judges the pixel checks, SAM 3.1 (sam-3.1-anchor) or the no-model template sensor (visual-sensor)
        type: choice
        options: ['sam-3.1-anchor', 'visual-sensor']
        default: 'sam-3.1-anchor'

permissions:
  contents: read

concurrency:
  group: jit-${{ github.ref }}-${{ inputs.mode || 'rehearsal' }}-${{ inputs.case || 'all' }}
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.event_name == 'pull_request' || inputs.mode == 'rehearsal'
    name: rehearsal (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The public air-jump bug, fixed exactly (expected: no catch) and "fixed" with a comment only
        # (expected: a strong catch). Stand-ins the study cannot draw from: the profile was written
        # alongside this bug, so these show the plumbing, not a detection rate.
        case: [air-jump-undo, air-jump-comment-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install patch
        uses: ./.github/actions/apt-install
        with:
          packages: patch
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Replay the stand-in proposal
        env:
          CASE: ${{ matrix.case }}
        run: |
          export PATH="$PWD/tools/godot:$PATH"
          start=$(date +%s)
          python -m expectrail.jit.cli run --report-file bench/jit/rehearsal/air-jump.report.txt \
            --candidate "bench/jit/rehearsal/$CASE.patch" --base bugs/reported/air-jump.patch \
            --proposal "bench/jit/rehearsal/$CASE/jit-proposal.json" --out "runs/jit/$CASE" \
            --run-id "rehearsal-${GITHUB_RUN_ID}-$CASE"
          echo "::notice title=Generated checks rehearsal ${CASE}::$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['status'], d['counts'], 'spend', d['spend']['usd'])" "runs/jit/$CASE/jit-run.json"); $(( $(date +%s) - start )) s"
          cat "runs/jit/$CASE/jit-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the rehearsal reached what it rehearses
        env:
          CASE: ${{ matrix.case }}
        run: |
          python - "$CASE" <<'EOF'
          import json, sys
          case = sys.argv[1]
          d = json.load(open(f"runs/jit/{case}/jit-run.json"))
          assert d["status"] == "complete", d["reason"]
          assert d["counts"]["valid"] >= 1, "no generated check was valid"
          if case == "air-jump-undo":
              assert not d["catches"], "the exact undo was caught"
          else:
              assert any(c["strength"] == "strong" for c in d["catches"]), "the comment-only fix was not caught"
          EOF
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-rehearsal-${{ matrix.case }}
          path: |
            runs/jit/${{ matrix.case }}/jit-run.json
            runs/jit/${{ matrix.case }}/jit-report.md
            runs/jit/${{ matrix.case }}/jit-routes/
          if-no-files-found: ignore
          retention-days: 14

  plan:
    # No secret, no game. The cases this run covers: live, the one change from the inputs, checked;
    # bench, the registered cases, and only from main with a signed registration whose pins hold.
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
      budget: ${{ steps.plan.outputs.budget }}
      offer: ${{ steps.plan.outputs.offer }}
      candidate: ${{ steps.plan.outputs.candidate }}
      sam_every: ${{ steps.plan.outputs.sam_every }}
      observer: ${{ steps.plan.outputs.observer }}
    env:
      MODE: ${{ inputs.mode }}
      OFFER: ${{ inputs.offer || 'baseline' }}
      CANDIDATE_TO_MODEL: ${{ inputs.candidate || 'shown' }}
      SAM_EVERY: ${{ inputs.sam_every || '10' }}
      OBSERVER: ${{ inputs.observer || 'sam-3.1-anchor' }}
      CASE: ${{ inputs.case }}
      BASE: ${{ inputs.base_patch }}
      CANDIDATE: ${{ inputs.candidate_patch }}
      REPORT: ${{ inputs.report_file }}
      BUDGET: ${{ inputs.budget_usd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Plan the cases
        id: plan
        run: |
          [[ "$OFFER" =~ ^(baseline|signals-reach|signals-reach-evidence|signals-reach-evidence-pixel)$ ]] || { echo "::error::offer must be baseline, signals-reach, signals-reach-evidence or signals-reach-evidence-pixel"; exit 1; }
          echo "offer=$OFFER" >> "$GITHUB_OUTPUT"
          [[ "$CANDIDATE_TO_MODEL" =~ ^(shown|withheld)$ ]] || { echo "::error::candidate must be shown or withheld"; exit 1; }
          echo "candidate=$CANDIDATE_TO_MODEL" >> "$GITHUB_OUTPUT"
          SAM_EVERY="${SAM_EVERY:-10}"; [[ "$SAM_EVERY" =~ ^([1-9]|[1-5][0-9]|60)$ ]] || { echo "::error::sam_every must be a whole number from 1 to 60"; exit 1; }
          echo "sam_every=$SAM_EVERY" >> "$GITHUB_OUTPUT"
          OBSERVER="${OBSERVER:-sam-3.1-anchor}"; [[ "$OBSERVER" =~ ^(sam-3\.1-anchor|visual-sensor)$ ]] || { echo "::error::observer must be sam-3.1-anchor or visual-sensor"; exit 1; }
          [[ "$OBSERVER" == "sam-3.1-anchor" || "$OFFER" == "signals-reach-evidence-pixel" ]] || { echo "::error::observer visual-sensor judges pixel checks, which only the signals-reach-evidence-pixel offer has"; exit 1; }
          echo "observer=$OBSERVER" >> "$GITHUB_OUTPUT"
          if [[ "$MODE" == "bench" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::the bench runs only from main"; exit 1; }
            [[ "$OFFER" == "baseline" ]] || { echo "::error::the known-bugs bench is registered under the baseline offer"; exit 1; }
            [[ "$CANDIDATE_TO_MODEL" == "shown" ]] || { echo "::error::the known-bugs bench is registered with the candidate shown"; exit 1; }
            python -m expectrail.jit.cli bench-check
            python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          from expectrail.jit import bench
          prereg = json.loads(bench.PREREG.read_text())
          print("cases=" + json.dumps([{k: c[k] for k in ("case", "base", "candidate", "report")} for c in bench.load_cases()]))
          print("budget=" + str(prereg["bar"]["maxSpendUsdPerCase"]))
          EOF
            exit 0
          fi
          if [[ "$MODE" == "repro" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::the reproduction bench runs only from main"; exit 1; }
            python -m expectrail.repro check
            python -m expectrail.repro cases --github-output >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$CASE" =~ ^[a-z0-9][a-z0-9-]{0,60}$ ]] || { echo "::error::case must be letters, digits and dashes"; exit 1; }
          [[ -z "$BASE" || "$BASE" =~ ^bugs/[A-Za-z0-9/._-]+\.patch$ ]] || { echo "::error::base_patch must be a patch under bugs/"; exit 1; }
          [[ "$CANDIDATE" =~ ^(bugs|bench)/[A-Za-z0-9/._-]+\.patch$ ]] || { echo "::error::candidate_patch must be a patch under bugs/ or bench/"; exit 1; }
          [[ "$REPORT" =~ ^(bugs|bench)/[A-Za-z0-9/._-]+$ ]] || { echo "::error::report_file must be under bugs/ or bench/"; exit 1; }
          [[ "$BUDGET" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::budget_usd must be a number"; exit 1; }
          for p in $BASE $CANDIDATE $REPORT; do [[ "$p" != *..* ]] || { echo "::error::no .. in paths"; exit 1; }; done
          python -c 'import json, os; print("cases=" + json.dumps([{"case": os.environ["CASE"], "base": os.environ["BASE"], "candidate": os.environ["CANDIDATE"], "report": os.environ["REPORT"]}]))' >> "$GITHUB_OUTPUT"
          echo "budget=$BUDGET" >> "$GITHUB_OUTPUT"

  measure:
    # Runs the game, no secret. Every probe's signals on the clean game and on the bug build (the base
    # patches), never on the candidate: the numbers the model chooses probes and thresholds from
    # (expectrail/jit/measure.py). The propose job re-checks them as data before they reach the prompt.
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    # The evidence (signals-reach-evidence, and the pixel setting, which offers it too) adds three replays
    # with frames a probe (expectrail/repro/evidence.py).
    timeout-minutes: ${{ startsWith(needs.plan.outputs.offer, 'signals-reach-evidence') && 75 || 30 }}
    env:
      BASE: ${{ matrix.c.base }}
      REPORT: ${{ matrix.c.report }}
      OFFER: ${{ needs.plan.outputs.offer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install patch (and, for the evidence's frames, a virtual display and software OpenGL)
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ startsWith(needs.plan.outputs.offer, 'signals-reach-evidence') && 'patch xvfb libgl1-mesa-dri libglx-mesa0' || 'patch' }}
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Measure every probe on the clean game and the bug build
        run: |
          export PATH="$PWD/tools/godot:$PATH"
          base=(); if [[ -n "$BASE" ]]; then base=(--base "$BASE"); fi
          python -m expectrail.jit.cli measure "${base[@]}" --out runs/jit-measure --offer "$OFFER" --report-file "$REPORT" \
            --evidence-jobs 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-measurements-${{ matrix.c.case }}
          path: |
            runs/jit-measure/jit-measurements.json
            runs/jit-measure/repro-evidence.json
          retention-days: 14

  propose:
    # Holds the model key. Reads the patch and the report as text, and the measure job's numbers;
    # replays nothing. In main-only (#223): only a dispatch from main can reach the key.
    needs: [plan, measure]
    environment: spend
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CASE: ${{ matrix.c.case }}
      BASE: ${{ matrix.c.base }}
      CANDIDATE: ${{ matrix.c.candidate }}
      REPORT: ${{ matrix.c.report }}
      BUDGET: ${{ needs.plan.outputs.budget }}
      OFFER: ${{ needs.plan.outputs.offer }}
      CANDIDATE_TO_MODEL: ${{ needs.plan.outputs.candidate }}
      OBSERVER: ${{ needs.plan.outputs.observer }}
      KEY_SET: ${{ secrets.MODEL_API_KEY != '' || secrets.META_API_KEY != '' }}
    steps:
      - name: Check the key
        run: '[[ "$KEY_SET" == "true" ]] || { echo "::error::Set MODEL_API_KEY (or META_API_KEY) in the main-only environment first."; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-measurements-${{ matrix.c.case }}
          path: runs/jit-measure
      - name: Propose checks (one Muse Spark call)
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
          # The spec sender sends nothing without a cap (expectrail/spend.py, #267): the change's per-defect budget.
          EXPECTRAIL_SPEC_USD_CAP: ${{ needs.plan.outputs.budget }}
        run: |
          base=(); if [[ -n "$BASE" ]]; then base=(--base "$BASE"); fi
          ev=(); if [[ -f runs/jit-measure/repro-evidence.json ]]; then ev=(--evidence runs/jit-measure/repro-evidence.json); fi
          wc=(); if [[ "$CANDIDATE_TO_MODEL" == "withheld" ]]; then wc=(--withhold-candidate); fi
          ob=(); if [[ "$OBSERVER" == "visual-sensor" ]]; then ob=(--observer visual-sensor); fi
          python -m expectrail.jit.cli propose --report-file "$REPORT" --candidate "$CANDIDATE" --out runs/jit-proposal \
            --budget-usd "$BUDGET" "${base[@]}" --measurements runs/jit-measure/jit-measurements.json --offer "$OFFER" "${ev[@]}" \
            "${wc[@]}" "${ob[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-proposal-${{ matrix.c.case }}
          path: runs/jit-proposal/jit-proposal.json
          retention-days: 14

  replay:
    # Runs the game. No secret. The first round; replay-final below is the result.
    needs: [plan, propose]
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CASE: ${{ matrix.c.case }}
      BASE: ${{ matrix.c.base }}
      CANDIDATE: ${{ matrix.c.candidate }}
      REPORT: ${{ matrix.c.report }}
      BUDGET: ${{ needs.plan.outputs.budget }}
      OFFER: ${{ needs.plan.outputs.offer }}
      CANDIDATE_TO_MODEL: ${{ needs.plan.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install patch
        uses: ./.github/actions/apt-install
        with:
          packages: patch
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-proposal-${{ matrix.c.case }}
          path: runs/jit-proposal
      - name: Replay, filter, run, assess
        run: |
          export PATH="$PWD/tools/godot:$PATH"
          base=(); if [[ -n "$BASE" ]]; then base=(--base "$BASE"); fi
          wc=(); if [[ "$CANDIDATE_TO_MODEL" == "withheld" ]]; then wc=(--withhold-candidate); fi
          python -m expectrail.jit.cli run --report-file "$REPORT" --candidate "$CANDIDATE" "${base[@]}" \
            --proposal runs/jit-proposal/jit-proposal.json --out "runs/jit/$CASE" --budget-usd "$BUDGET" \
            --run-id "ci-${GITHUB_RUN_ID}-$CASE-round1" --offer "$OFFER" "${wc[@]}"
          echo "::notice title=Generated checks ${CASE} (round 1)::$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['status'], d['counts'], 'spend', d['spend']['usd'])" "runs/jit/$CASE/jit-run.json")"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-${{ matrix.c.case }}-round1
          path: |
            runs/jit/${{ matrix.c.case }}/jit-run.json
            runs/jit/${{ matrix.c.case }}/jit-report.md
            runs/jit/${{ matrix.c.case }}/jit-routes/
          if-no-files-found: error
          retention-days: 14

  revise:
    # Holds the model key; runs no game. One more model call, only when the first replay rejected a
    # check: told why each was rejected (from the clean game and the bug build only), within what is
    # left of the same budget (expectrail/jit/intent.py, revise_to_file). Always writes the proposal
    # replay-final uses (revised, or the first one unchanged) and says which. Nothing here is a pass.
    needs: [plan, measure, replay]
    environment: spend
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CASE: ${{ matrix.c.case }}
      BASE: ${{ matrix.c.base }}
      CANDIDATE: ${{ matrix.c.candidate }}
      REPORT: ${{ matrix.c.report }}
      BUDGET: ${{ needs.plan.outputs.budget }}
      OFFER: ${{ needs.plan.outputs.offer }}
      CANDIDATE_TO_MODEL: ${{ needs.plan.outputs.candidate }}
      OBSERVER: ${{ needs.plan.outputs.observer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-measurements-${{ matrix.c.case }}
          path: runs/jit-measure
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-proposal-${{ matrix.c.case }}
          path: runs/jit-proposal
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-${{ matrix.c.case }}-round1
          path: runs/jit-round1
      - name: Revise the rejected checks (at most one Muse Spark call)
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
          # The spec sender sends nothing without a cap (expectrail/spend.py, #267): the change's per-defect budget.
          EXPECTRAIL_SPEC_USD_CAP: ${{ needs.plan.outputs.budget }}
        run: |
          mkdir -p runs/jit-proposal-2
          base=(); if [[ -n "$BASE" ]]; then base=(--base "$BASE"); fi
          ev=(); if [[ -f runs/jit-measure/repro-evidence.json ]]; then ev=(--evidence runs/jit-measure/repro-evidence.json); fi
          wc=(); if [[ "$CANDIDATE_TO_MODEL" == "withheld" ]]; then wc=(--withhold-candidate); fi
          ob=(); if [[ "$OBSERVER" == "visual-sensor" ]]; then ob=(--observer visual-sensor); fi
          # Any failure here leaves the first round standing; it can never become a pass or a catch.
          python -m expectrail.jit.cli revise --report-file "$REPORT" --candidate "$CANDIDATE" "${base[@]}" "${ev[@]}" \
            --proposal runs/jit-proposal/jit-proposal.json --record runs/jit-round1/jit-run.json \
            --measurements runs/jit-measure/jit-measurements.json --out runs/jit-proposal-2 \
            --budget-usd "$BUDGET" --github-output runs/jit-proposal-2/revised.txt --offer "$OFFER" "${wc[@]}" "${ob[@]}" \
            || { echo "::warning::the revision failed; the first round stands"; echo "revised=false" > runs/jit-proposal-2/revised.txt; }
          [[ -f runs/jit-proposal-2/jit-proposal.json ]] || echo "revised=false" > runs/jit-proposal-2/revised.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-proposal-${{ matrix.c.case }}-revised
          path: runs/jit-proposal-2/
          retention-days: 14

  replay-final:
    # Runs the game. No secret. The revised proposal, replayed from scratch with the first round's spend
    # carried in; or, when nothing was revised, the first round's record as it is. Under the pixel setting
    # the proposal the revise job wrote is always replayed, and each pixel check's probe is replayed with
    # frames. With SAM, the frames are kept for pixel-ask (--pixel-capture); nothing is asked here, so the
    # pixel rows are not run, and this record is not the result (pixel-judge's is). With the template
    # sensor, the pixel checks are judged here with the sensor-bank job's bank, and this record is the result.
    needs: [plan, replay, revise, sensor-bank]
    # sensor-bank runs only for the template sensor; when it is skipped this job must still run.
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
      && needs.plan.result == 'success' && needs.replay.result == 'success' && needs.revise.result == 'success'
      && (needs.sensor-bank.result == 'success' || (needs.sensor-bank.result == 'skipped' && needs.plan.outputs.observer != 'visual-sensor'))
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.plan.outputs.offer == 'signals-reach-evidence-pixel' && 90 || 60 }}
    env:
      CASE: ${{ matrix.c.case }}
      BASE: ${{ matrix.c.base }}
      CANDIDATE: ${{ matrix.c.candidate }}
      REPORT: ${{ matrix.c.report }}
      BUDGET: ${{ needs.plan.outputs.budget }}
      OFFER: ${{ needs.plan.outputs.offer }}
      CANDIDATE_TO_MODEL: ${{ needs.plan.outputs.candidate }}
      SAM_EVERY: ${{ needs.plan.outputs.sam_every }}
      OBSERVER: ${{ needs.plan.outputs.observer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install patch (and, for the pixel checks' frames, a virtual display and software OpenGL)
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ needs.plan.outputs.offer == 'signals-reach-evidence-pixel' && 'patch xvfb libgl1-mesa-dri libglx-mesa0' || 'patch' }}
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-proposal-${{ matrix.c.case }}-revised
          path: runs/jit-proposal-2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-${{ matrix.c.case }}-round1
          path: runs/jit-round1
      - name: Pillow and NumPy, for the template sensor
        if: needs.plan.outputs.observer == 'visual-sensor'
        run: python -m pip install pillow==12.3.0 numpy==2.5.3
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.plan.outputs.observer == 'visual-sensor'
        with:
          name: jit-sensor-bank
          path: runs/sensor-bank
      - name: Replay the revised proposal, or keep the first round
        run: |
          revised=false; grep -qx "revised=true" runs/jit-proposal-2/revised.txt 2>/dev/null && revised=true
          # Under the pixel setting the revise job's proposal (revised, or the first one with the first
          # round's spend) is replayed whether or not it was revised, to capture the pixel checks' frames.
          px=()
          if [[ "$OFFER" == "signals-reach-evidence-pixel" && -f runs/jit-proposal-2/jit-proposal.json ]]; then
            SAM_EVERY="${SAM_EVERY:-10}"; [[ "$SAM_EVERY" =~ ^([1-9]|[1-5][0-9]|60)$ ]] || { echo "::error::sam_every must be a whole number from 1 to 60"; exit 1; }
            if [[ "$OBSERVER" == "visual-sensor" ]]; then
              [[ -f runs/sensor-bank/bank.json ]] || { echo "::error::observer visual-sensor needs the sensor-bank job's bank"; exit 1; }
              px=(--observer visual-sensor --sensor-bank runs/sensor-bank/bank.json --sam-every "$SAM_EVERY")
            else
              px=(--observer sam-3.1-anchor --pixel-capture runs/pixel-capture --sam-every "$SAM_EVERY")
            fi
          fi
          mkdir -p "runs/jit/$CASE"
          if [[ "$revised" == "true" || ${#px[@]} -gt 0 ]]; then
            export PATH="$PWD/tools/godot:$PATH"
            base=(); if [[ -n "$BASE" ]]; then base=(--base "$BASE"); fi
            wc=(); if [[ "$CANDIDATE_TO_MODEL" == "withheld" ]]; then wc=(--withhold-candidate); fi
            python -m expectrail.jit.cli run --report-file "$REPORT" --candidate "$CANDIDATE" "${base[@]}" \
              --proposal runs/jit-proposal-2/jit-proposal.json --out "runs/jit/$CASE" --budget-usd "$BUDGET" \
              --run-id "ci-${GITHUB_RUN_ID}-$CASE" --offer "$OFFER" "${px[@]}" "${wc[@]}"
          else
            cp runs/jit-round1/jit-run.json "runs/jit/$CASE/jit-run.json"
          fi
          echo "::notice title=Generated checks ${CASE} (revised: $revised)::$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['status'], d['counts'], 'spend', d['spend']['usd'])" "runs/jit/$CASE/jit-run.json")"
          python -m expectrail.jit.cli report "runs/jit/$CASE/jit-run.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Under the pixel setting with SAM this is not the result: pixel-judge uploads jit-<case>.
          name: jit-${{ matrix.c.case }}${{ needs.plan.outputs.offer == 'signals-reach-evidence-pixel' && needs.plan.outputs.observer != 'visual-sensor' && '-captured' || '' }}
          path: |
            runs/jit/${{ matrix.c.case }}/jit-run.json
            runs/jit/${{ matrix.c.case }}/jit-routes/
            runs/pixel-capture/
          if-no-files-found: ignore
          retention-days: 14

  pixel-ask:
    # The pixel setting only. Holds SAM's key; runs no game and installs no engine. It reads the frames
    # replay-final kept, as untrusted data (expectrail/jit/pixel_jobs.py checks their layout), and asks SAM
    # about the frames each pixel check judges. Every image is reserved first against what the change's cap
    # has left after replay-final's record; over that, nothing is sent. In main-only: only a dispatch from
    # main can reach the key.
    needs: [plan, replay-final]
    environment: spend
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal' && needs.plan.outputs.offer == 'signals-reach-evidence-pixel' && needs.plan.outputs.observer != 'visual-sensor'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CASE: ${{ matrix.c.case }}
      BUDGET: ${{ needs.plan.outputs.budget }}
      SAM_EVERY: ${{ needs.plan.outputs.sam_every }}
      KEY_SET: ${{ secrets.MODEL_API_KEY != '' || secrets.META_API_KEY != '' }}
    steps:
      - name: Check the key
        run: '[[ "$KEY_SET" == "true" ]] || { echo "::error::Set MODEL_API_KEY (or META_API_KEY) in the main-only environment first."; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-${{ matrix.c.case }}-captured
          path: runs/captured
      - name: Ask SAM 3.1 about the captured frames (one image a judged frame)
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
        run: |
          mkdir -p runs/pixel-answers
          if [[ ! -d runs/captured/pixel-capture ]]; then
            echo "::notice title=Pixel checks ${CASE}::no frames were captured, so nothing is asked"
            exit 0
          fi
          SAM_EVERY="${SAM_EVERY:-10}"; [[ "$SAM_EVERY" =~ ^([1-9]|[1-5][0-9]|60)$ ]] || { echo "::error::sam_every must be a whole number from 1 to 60"; exit 1; }
          left=$(python -m expectrail.jit.cli pixel-budget --record "runs/captured/jit/$CASE/jit-run.json" --budget-usd "$BUDGET")
          export EXPECTRAIL_SAM_USD_CAP="$left"
          echo "::notice title=SAM budget ${CASE}::\$$left left of the change's \$$BUDGET"
          # Exit 1 means nothing was asked (over the budget, or nothing to ask): the pixel rows stay not run.
          python -m expectrail.jit.cli pixel-ask --replays runs/captured/pixel-capture \
            --out runs/pixel-answers/answers.json --budget-usd "$left" --sam-live --sam-every "$SAM_EVERY" \
            || echo "::warning title=Pixel checks ${CASE}::SAM was not asked; the pixel checks stay not run"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-${{ matrix.c.case }}-pixel-answers
          path: runs/pixel-answers/answers.json
          if-no-files-found: ignore
          retention-days: 14

  pixel-judge:
    # The pixel setting only. Runs the game, no secret. The revise job's proposal replayed once more, with
    # the pixel checks judged from the frames replay-final kept and SAM's answers (--pixel-replays and
    # --sam-answers; a missing answer or a changed frame drops the check). With no frames or no answers,
    # replay-final's record is kept as it is, its pixel rows not run. This job's record is the result.
    needs: [plan, revise, replay-final, pixel-ask]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal' && needs.plan.outputs.offer == 'signals-reach-evidence-pixel' && needs.plan.outputs.observer != 'visual-sensor' && needs.replay-final.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CASE: ${{ matrix.c.case }}
      BASE: ${{ matrix.c.base }}
      CANDIDATE: ${{ matrix.c.candidate }}
      REPORT: ${{ matrix.c.report }}
      BUDGET: ${{ needs.plan.outputs.budget }}
      OFFER: ${{ needs.plan.outputs.offer }}
      CANDIDATE_TO_MODEL: ${{ needs.plan.outputs.candidate }}
      SAM_EVERY: ${{ needs.plan.outputs.sam_every }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install patch
        uses: ./.github/actions/apt-install
        with:
          packages: patch
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-proposal-${{ matrix.c.case }}-revised
          path: runs/jit-proposal-2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-${{ matrix.c.case }}-captured
          path: runs/captured
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        # pixel-ask uploads nothing when nothing was captured or nothing was asked.
        continue-on-error: true
        with:
          name: jit-${{ matrix.c.case }}-pixel-answers
          path: runs/pixel-answers
      - name: Judge the pixel checks from the captured frames and SAM's answers
        run: |
          mkdir -p "runs/jit/$CASE"
          if [[ -f runs/pixel-answers/answers.json && -d runs/captured/pixel-capture && -f runs/jit-proposal-2/jit-proposal.json ]]; then
            SAM_EVERY="${SAM_EVERY:-10}"; [[ "$SAM_EVERY" =~ ^([1-9]|[1-5][0-9]|60)$ ]] || { echo "::error::sam_every must be a whole number from 1 to 60"; exit 1; }
            export PATH="$PWD/tools/godot:$PATH"
            base=(); if [[ -n "$BASE" ]]; then base=(--base "$BASE"); fi
            wc=(); if [[ "$CANDIDATE_TO_MODEL" == "withheld" ]]; then wc=(--withhold-candidate); fi
            python -m expectrail.jit.cli run --report-file "$REPORT" --candidate "$CANDIDATE" "${base[@]}" \
              --proposal runs/jit-proposal-2/jit-proposal.json --out "runs/jit/$CASE" --budget-usd "$BUDGET" \
              --run-id "ci-${GITHUB_RUN_ID}-$CASE" --offer "$OFFER" --observer sam-3.1-anchor \
              --sam-answers runs/pixel-answers/answers.json --pixel-replays runs/captured/pixel-capture \
              --sam-every "$SAM_EVERY" "${wc[@]}"
          else
            echo "::warning title=Pixel checks ${CASE}::no captured frames or no SAM answers; replay-final's record stands, its pixel checks not run"
            # With no frames kept the artifact's root is the record's own folder, not runs/.
            record="runs/captured/jit/$CASE/jit-run.json"; [[ -f "$record" ]] || record=runs/captured/jit-run.json
            cp "$record" "runs/jit/$CASE/jit-run.json"
          fi
          echo "::notice title=Generated checks ${CASE} (pixel)::$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['status'], d['counts'], 'spend', d['spend']['usd'])" "runs/jit/$CASE/jit-run.json")"
          python -m expectrail.jit.cli report "runs/jit/$CASE/jit-run.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-${{ matrix.c.case }}
          path: |
            runs/jit/${{ matrix.c.case }}/jit-run.json
            runs/jit/${{ matrix.c.case }}/jit-routes/
          if-no-files-found: ignore
          retention-days: 14

  score:
    # Bench mode only. No secret, no game: each case's final record against the registered bar.
    needs: [plan, replay-final]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'bench' && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: jit-known-*
          path: runs/artifacts
      - name: Score against the registration
        run: |
          mkdir -p runs/bench
          for d in runs/artifacts/jit-known-*; do
            name="${d#runs/artifacts/jit-}"
            [[ "$name" == *-round1 ]] && continue
            [[ -f "$d/jit-run.json" ]] && mkdir -p "runs/bench/$name" && cp "$d/jit-run.json" "runs/bench/$name/"
          done
          python -m expectrail.jit.cli bench-score --records runs/bench --out runs/bench-score
          cat runs/bench-score/jit-bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-bench
          path: |
            runs/bench-score/
            runs/bench/
          retention-days: 90

  repro-score:
    # Repro mode only. No secret, no game: each defect's final record, read by the reproduction scorer.
    # A defect with no usable record is "no result" and never counts as reproduced. It counts only records
    # made with this run's candidate setting, and reads the committed screen record (--screen), so the
    # screen-only defects get their own rate and a miss the record does not show gets its reason.
    needs: [plan, replay-final, pixel-judge]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'repro' && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: jit-repro-*
          path: runs/artifacts
      - name: Score the reproduction bench
        env:
          OFFER: ${{ needs.plan.outputs.offer }}
          CANDIDATE_TO_MODEL: ${{ needs.plan.outputs.candidate }}
        run: |
          mkdir -p runs/repro
          for d in runs/artifacts/jit-repro-*; do
            name="${d#runs/artifacts/jit-}"
            [[ "$name" == *-round1 || "$name" == *-captured || "$name" == *-pixel-answers ]] && continue
            [[ -f "$d/jit-run.json" ]] && mkdir -p "runs/repro/$name" && cp "$d/jit-run.json" "runs/repro/$name/"
          done
          python -m expectrail.repro score --records runs/repro --out runs/repro-score \
            --source "jit.yml run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}, at ${GITHUB_SHA}" --offer "$OFFER" \
            --candidate "$CANDIDATE_TO_MODEL" --screen bench/jit/public/screen.json
          cat runs/repro-score/repro-score.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-score
          path: |
            runs/repro-score/
            runs/repro/
          retention-days: 90

  sensor-bank:
    # The pixel setting with observer visual-sensor only. Runs the clean game alone, no secret, no patch,
    # no proposal: four dedicated clean routes, from which the template sensor's bank is calibrated once
    # for the whole run (expectrail/jit/template_observer.py, calibrate_bank). No bug build or candidate
    # reaches it, so a change cannot shape the bank that judges it.
    needs: [plan]
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal' && needs.plan.outputs.offer == 'signals-reach-evidence-pixel' && needs.plan.outputs.observer == 'visual-sensor'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt pillow==12.3.0 numpy==2.5.3
      - name: Install a virtual display and software OpenGL, for the clean frames
        uses: ./.github/actions/apt-install
        with:
          packages: xvfb libgl1-mesa-dri libglx-mesa0
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Calibrate the template bank on the clean game
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          export PATH="$PWD/tools/godot:$PATH"
          python -m expectrail.jit.cli sensor-bank --out runs/sensor-bank/bank.json --work runs/sensor-calibration \
            > sensor-bank-summary.json
          echo "::notice title=Sensor bank::$(cat sensor-bank-summary.json)"
          mv sensor-bank-summary.json runs/sensor-bank/summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-sensor-bank
          path: runs/sensor-bank/
          if-no-files-found: error
          retention-days: 14
