name: Generated checks

# Per-change check generation, report-only (docs/jit.md). For one candidate change, Muse Spark proposes
# checks in the closed trace language from the bug report and the patch; the job keeps only checks
# that pass 3 of 3 on the clean game and fail 3 of 3 on a near miss of the change, runs them on the
# candidate, and records what they catch, strong or weak. Nothing here accepts or rejects a change.
#
# The model key and the change's code never meet: the propose and revise jobs hold the key and only
# read the patch as text; the measure and replay jobs run the game and have no secret. On pull
# requests and in rehearsal mode the proposal is a committed stand-in (bench/jit/rehearsal/), so no
# key and no spend: a rehearsal proves the plumbing and is never a result.
#
# live: one change, from the inputs. bench: the known-bugs bench (expectrail/jit/bench.py), every case
# in bench/jit/known/cases.json through the same jobs, scored against the signed registration. Both
# run each job once per case (a matrix), so the keyed jobs stay in main-only: a called workflow would
# not see the environment's keys (bench run 42923427104).
#
# repro: the public reproduction bench (bench/jit/public, issue #285), from main only. Every defect is
# one case through the same jobs: the defect is the bug, and the candidate is the same for all, one
# comment line in the game's README (bench/jit/public/no-fix.patch), so the checks come from the bug
# build and the report alone. The cases come from the committed bench and nothing typed at dispatch.
# repro-score reads the final records and writes the reproduction rate (expectrail/repro/score.py).
on:
  pull_request:
    paths:
      - 'expectrail/jit/**'
      - 'contracts/jit-run.v1.schema.json'
      - 'bench/jit/**'
      - '.github/workflows/jit.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: rehearsal (committed stand-ins, no key), live (one change, Muse Spark), bench (the known-bugs bench, from main) or repro (the public reproduction bench, from main)
        type: choice
        options: ['rehearsal', 'live', 'bench', 'repro']
        default: 'rehearsal'
      case:
        description: A name for this change (letters, digits and dashes); live mode only
        default: ''
      base_patch:
        description: The bug, as a patch under bugs/ (empty for none); live mode only
        default: ''
      candidate_patch:
        description: The candidate change, as a patch under bugs/ or bench/; live mode only
        default: ''
      report_file:
        description: The bug report, a text file under bugs/ or bench/; live mode only
        default: ''
      budget_usd:
        description: Spend cap per change, in US dollars (bench mode uses the registration's)
        default: '2'

permissions:
  contents: read

concurrency:
  group: jit-${{ github.ref }}-${{ inputs.mode || 'rehearsal' }}-${{ inputs.case || 'all' }}
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.event_name == 'pull_request' || inputs.mode == 'rehearsal'
    name: rehearsal (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The public air-jump bug, fixed exactly (expected: no catch) and "fixed" with a comment only
        # (expected: a strong catch). Stand-ins the study cannot draw from: the profile was written
        # alongside this bug, so these show the plumbing, not a detection rate.
        case: [air-jump-undo, air-jump-comment-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install patch
        uses: ./.github/actions/apt-install
        with:
          packages: patch
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Replay the stand-in proposal
        env:
          CASE: ${{ matrix.case }}
        run: |
          export PATH="$PWD/tools/godot:$PATH"
          start=$(date +%s)
          python -m expectrail.jit.cli run --report-file bench/jit/rehearsal/air-jump.report.txt \
            --candidate "bench/jit/rehearsal/$CASE.patch" --base bugs/reported/air-jump.patch \
            --proposal "bench/jit/rehearsal/$CASE/jit-proposal.json" --out "runs/jit/$CASE" \
            --run-id "rehearsal-${GITHUB_RUN_ID}-$CASE"
          echo "::notice title=Generated checks rehearsal ${CASE}::$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['status'], d['counts'], 'spend', d['spend']['usd'])" "runs/jit/$CASE/jit-run.json"); $(( $(date +%s) - start )) s"
          cat "runs/jit/$CASE/jit-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the rehearsal reached what it rehearses
        env:
          CASE: ${{ matrix.case }}
        run: |
          python - "$CASE" <<'EOF'
          import json, sys
          case = sys.argv[1]
          d = json.load(open(f"runs/jit/{case}/jit-run.json"))
          assert d["status"] == "complete", d["reason"]
          assert d["counts"]["valid"] >= 1, "no generated check was valid"
          if case == "air-jump-undo":
              assert not d["catches"], "the exact undo was caught"
          else:
              assert any(c["strength"] == "strong" for c in d["catches"]), "the comment-only fix was not caught"
          EOF
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-rehearsal-${{ matrix.case }}
          path: |
            runs/jit/${{ matrix.case }}/jit-run.json
            runs/jit/${{ matrix.case }}/jit-report.md
            runs/jit/${{ matrix.case }}/jit-routes/
          if-no-files-found: ignore
          retention-days: 14

  plan:
    # No secret, no game. The cases this run covers: live, the one change from the inputs, checked;
    # bench, the registered cases, and only from main with a signed registration whose pins hold.
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
      budget: ${{ steps.plan.outputs.budget }}
    env:
      MODE: ${{ inputs.mode }}
      CASE: ${{ inputs.case }}
      BASE: ${{ inputs.base_patch }}
      CANDIDATE: ${{ inputs.candidate_patch }}
      REPORT: ${{ inputs.report_file }}
      BUDGET: ${{ inputs.budget_usd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Plan the cases
        id: plan
        run: |
          if [[ "$MODE" == "bench" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::the bench runs only from main"; exit 1; }
            python -m expectrail.jit.cli bench-check
            python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          from expectrail.jit import bench
          prereg = json.loads(bench.PREREG.read_text())
          print("cases=" + json.dumps([{k: c[k] for k in ("case", "base", "candidate", "report")} for c in bench.load_cases()]))
          print("budget=" + str(prereg["bar"]["maxSpendUsdPerCase"]))
          EOF
            exit 0
          fi
          if [[ "$MODE" == "repro" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::the reproduction bench runs only from main"; exit 1; }
            python -m expectrail.repro check
            python -m expectrail.repro cases --github-output >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$CASE" =~ ^[a-z0-9][a-z0-9-]{0,60}$ ]] || { echo "::error::case must be letters, digits and dashes"; exit 1; }
          [[ -z "$BASE" || "$BASE" =~ ^bugs/[A-Za-z0-9/._-]+\.patch$ ]] || { echo "::error::base_patch must be a patch under bugs/"; exit 1; }
          [[ "$CANDIDATE" =~ ^(bugs|bench)/[A-Za-z0-9/._-]+\.patch$ ]] || { echo "::error::candidate_patch must be a patch under bugs/ or bench/"; exit 1; }
          [[ "$REPORT" =~ ^(bugs|bench)/[A-Za-z0-9/._-]+$ ]] || { echo "::error::report_file must be under bugs/ or bench/"; exit 1; }
          [[ "$BUDGET" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::budget_usd must be a number"; exit 1; }
          for p in $BASE $CANDIDATE $REPORT; do [[ "$p" != *..* ]] || { echo "::error::no .. in paths"; exit 1; }; done
          python -c 'import json, os; print("cases=" + json.dumps([{"case": os.environ["CASE"], "base": os.environ["BASE"], "candidate": os.environ["CANDIDATE"], "report": os.environ["REPORT"]}]))' >> "$GITHUB_OUTPUT"
          echo "budget=$BUDGET" >> "$GITHUB_OUTPUT"

  measure:
    # Runs the game, no secret. Every probe's signals on the clean game and on the bug build (the base
    # patches), never on the candidate: the numbers the model chooses probes and thresholds from
    # (expectrail/jit/measure.py). The propose job re-checks them as data before they reach the prompt.
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE: ${{ matrix.c.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install patch
        uses: ./.github/actions/apt-install
        with:
          packages: patch
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - name: Measure every probe on the clean game and the bug build
        run: |
          export PATH="$PWD/tools/godot:$PATH"
          base=(); if [[ -n "$BASE" ]]; then base=(--base "$BASE"); fi
          python -m expectrail.jit.cli measure "${base[@]}" --out runs/jit-measure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-measurements-${{ matrix.c.case }}
          path: runs/jit-measure/jit-measurements.json
          retention-days: 14

  propose:
    # Holds the model key. Reads the patch and the report as text, and the measure job's numbers;
    # replays nothing. In main-only (#223): only a dispatch from main can reach the key.
    needs: [plan, measure]
    environment: main-only
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CASE: ${{ matrix.c.case }}
      BASE: ${{ matrix.c.base }}
      CANDIDATE: ${{ matrix.c.candidate }}
      REPORT: ${{ matrix.c.report }}
      BUDGET: ${{ needs.plan.outputs.budget }}
      KEY_SET: ${{ secrets.MODEL_API_KEY != '' || secrets.META_API_KEY != '' }}
    steps:
      - name: Check the key
        run: '[[ "$KEY_SET" == "true" ]] || { echo "::error::Set MODEL_API_KEY (or META_API_KEY) in the main-only environment first."; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-measurements-${{ matrix.c.case }}
          path: runs/jit-measure
      - name: Propose checks (one Muse Spark call)
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
        run: |
          base=(); if [[ -n "$BASE" ]]; then base=(--base "$BASE"); fi
          python -m expectrail.jit.cli propose --report-file "$REPORT" --candidate "$CANDIDATE" --out runs/jit-proposal \
            --budget-usd "$BUDGET" "${base[@]}" --measurements runs/jit-measure/jit-measurements.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-proposal-${{ matrix.c.case }}
          path: runs/jit-proposal/jit-proposal.json
          retention-days: 14

  replay:
    # Runs the game. No secret. The first round; replay-final below is the result.
    needs: [plan, propose]
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CASE: ${{ matrix.c.case }}
      BASE: ${{ matrix.c.base }}
      CANDIDATE: ${{ matrix.c.candidate }}
      REPORT: ${{ matrix.c.report }}
      BUDGET: ${{ needs.plan.outputs.budget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install patch
        uses: ./.github/actions/apt-install
        with:
          packages: patch
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-proposal-${{ matrix.c.case }}
          path: runs/jit-proposal
      - name: Replay, filter, run, assess
        run: |
          export PATH="$PWD/tools/godot:$PATH"
          base=(); if [[ -n "$BASE" ]]; then base=(--base "$BASE"); fi
          python -m expectrail.jit.cli run --report-file "$REPORT" --candidate "$CANDIDATE" "${base[@]}" \
            --proposal runs/jit-proposal/jit-proposal.json --out "runs/jit/$CASE" --budget-usd "$BUDGET" \
            --run-id "ci-${GITHUB_RUN_ID}-$CASE-round1"
          echo "::notice title=Generated checks ${CASE} (round 1)::$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['status'], d['counts'], 'spend', d['spend']['usd'])" "runs/jit/$CASE/jit-run.json")"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-${{ matrix.c.case }}-round1
          path: |
            runs/jit/${{ matrix.c.case }}/jit-run.json
            runs/jit/${{ matrix.c.case }}/jit-report.md
            runs/jit/${{ matrix.c.case }}/jit-routes/
          if-no-files-found: error
          retention-days: 14

  revise:
    # Holds the model key; runs no game. One more model call, only when the first replay rejected a
    # check: told why each was rejected (from the clean game and the bug build only), within what is
    # left of the same budget (expectrail/jit/intent.py, revise_to_file). Always writes the proposal
    # replay-final uses (revised, or the first one unchanged) and says which. Nothing here is a pass.
    needs: [plan, measure, replay]
    environment: main-only
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CASE: ${{ matrix.c.case }}
      BASE: ${{ matrix.c.base }}
      CANDIDATE: ${{ matrix.c.candidate }}
      REPORT: ${{ matrix.c.report }}
      BUDGET: ${{ needs.plan.outputs.budget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-measurements-${{ matrix.c.case }}
          path: runs/jit-measure
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-proposal-${{ matrix.c.case }}
          path: runs/jit-proposal
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-${{ matrix.c.case }}-round1
          path: runs/jit-round1
      - name: Revise the rejected checks (at most one Muse Spark call)
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
        run: |
          mkdir -p runs/jit-proposal-2
          base=(); if [[ -n "$BASE" ]]; then base=(--base "$BASE"); fi
          # Any failure here leaves the first round standing; it can never become a pass or a catch.
          python -m expectrail.jit.cli revise --report-file "$REPORT" --candidate "$CANDIDATE" "${base[@]}" \
            --proposal runs/jit-proposal/jit-proposal.json --record runs/jit-round1/jit-run.json \
            --measurements runs/jit-measure/jit-measurements.json --out runs/jit-proposal-2 \
            --budget-usd "$BUDGET" --github-output runs/jit-proposal-2/revised.txt \
            || { echo "::warning::the revision failed; the first round stands"; echo "revised=false" > runs/jit-proposal-2/revised.txt; }
          [[ -f runs/jit-proposal-2/jit-proposal.json ]] || echo "revised=false" > runs/jit-proposal-2/revised.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-proposal-${{ matrix.c.case }}-revised
          path: runs/jit-proposal-2/
          retention-days: 14

  replay-final:
    # Runs the game. No secret. The revised proposal, replayed from scratch with the first round's spend
    # carried in; or, when nothing was revised, the first round's record as it is.
    needs: [plan, replay, revise]
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearsal'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CASE: ${{ matrix.c.case }}
      BASE: ${{ matrix.c.base }}
      CANDIDATE: ${{ matrix.c.candidate }}
      REPORT: ${{ matrix.c.report }}
      BUDGET: ${{ needs.plan.outputs.budget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install patch
        uses: ./.github/actions/apt-install
        with:
          packages: patch
      - name: Download Godot 4.7.2 and check its SHA-512
        uses: ./.github/actions/get-godot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-proposal-${{ matrix.c.case }}-revised
          path: runs/jit-proposal-2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jit-${{ matrix.c.case }}-round1
          path: runs/jit-round1
      - name: Replay the revised proposal, or keep the first round
        run: |
          revised=false; grep -qx "revised=true" runs/jit-proposal-2/revised.txt 2>/dev/null && revised=true
          mkdir -p "runs/jit/$CASE"
          if [[ "$revised" == "true" ]]; then
            export PATH="$PWD/tools/godot:$PATH"
            base=(); if [[ -n "$BASE" ]]; then base=(--base "$BASE"); fi
            python -m expectrail.jit.cli run --report-file "$REPORT" --candidate "$CANDIDATE" "${base[@]}" \
              --proposal runs/jit-proposal-2/jit-proposal.json --out "runs/jit/$CASE" --budget-usd "$BUDGET" \
              --run-id "ci-${GITHUB_RUN_ID}-$CASE"
          else
            cp runs/jit-round1/jit-run.json "runs/jit/$CASE/jit-run.json"
          fi
          echo "::notice title=Generated checks ${CASE} (revised: $revised)::$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['status'], d['counts'], 'spend', d['spend']['usd'])" "runs/jit/$CASE/jit-run.json")"
          python -m expectrail.jit.cli report "runs/jit/$CASE/jit-run.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-${{ matrix.c.case }}
          path: |
            runs/jit/${{ matrix.c.case }}/jit-run.json
            runs/jit/${{ matrix.c.case }}/jit-routes/
          if-no-files-found: ignore
          retention-days: 14

  score:
    # Bench mode only. No secret, no game: each case's final record against the registered bar.
    needs: [plan, replay-final]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'bench' && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: jit-known-*
          path: runs/artifacts
      - name: Score against the registration
        run: |
          mkdir -p runs/bench
          for d in runs/artifacts/jit-known-*; do
            name="${d#runs/artifacts/jit-}"
            [[ "$name" == *-round1 ]] && continue
            [[ -f "$d/jit-run.json" ]] && mkdir -p "runs/bench/$name" && cp "$d/jit-run.json" "runs/bench/$name/"
          done
          python -m expectrail.jit.cli bench-score --records runs/bench --out runs/bench-score
          cat runs/bench-score/jit-bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-bench
          path: |
            runs/bench-score/
            runs/bench/
          retention-days: 90

  repro-score:
    # Repro mode only. No secret, no game: each defect's final record, read by the reproduction scorer.
    # A defect with no usable record is "no result" and never counts as reproduced.
    needs: [plan, replay-final]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'repro' && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: jit-repro-*
          path: runs/artifacts
      - name: Score the reproduction bench
        run: |
          mkdir -p runs/repro
          for d in runs/artifacts/jit-repro-*; do
            name="${d#runs/artifacts/jit-}"
            [[ "$name" == *-round1 ]] && continue
            [[ -f "$d/jit-run.json" ]] && mkdir -p "runs/repro/$name" && cp "$d/jit-run.json" "runs/repro/$name/"
          done
          python -m expectrail.repro score --records runs/repro --out runs/repro-score \
            --source "jit.yml run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}, at ${GITHUB_SHA}"
          cat runs/repro-score/repro-score.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-score
          path: |
            runs/repro-score/
            runs/repro/
          retention-days: 90
