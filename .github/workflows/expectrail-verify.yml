name: Expectrail verify
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
permissions:
  contents: read
concurrency:
  group: expectrail-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/expectrail-capture.yml
