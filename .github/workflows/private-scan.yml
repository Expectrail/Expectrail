# The export scan against the private set, on a pull request, before it merges.
#
# CI's private job (agents-harness-private) runs only on main, because a pull request's own code
# must never run where the private set is. Without this workflow a page or bench file that matched
# the private set would be found only after it merged, and main would go red.
#
# How it runs (no pull_request_target, which GitHub blocks by default in public repositories from
# December 2, 2026, and no workflow_run, which failed to start here: #247):
# 1. private-scan-request.yml runs on the pull request with no secret and starts this workflow on
#    the default branch (workflow_dispatch) with the head commit's id.
# 2. A dispatched run uses the copy of this file on the branch it is started on. The job is in the
#    main-only environment, which holds HELDOUT_TOKEN and which only main may use, so a run started
#    on any other branch is refused before a step runs.
# 3. The scanner comes from main. The commit to scan is checked out into scanned/ as data; nothing
#    from it is run or imported.
# 4. When the input is a full commit id, the result is posted on that commit as the check
#    `private-export-scan`. The check says passed or failed and links here; the log prints counts
#    and file names, never the matched text.
#
# Same-repository pull requests only; a fork's pull request cannot start it, so it cannot be used to
# test guesses against the private set. A pull request that changes the scanner itself is scanned by
# main's scanner until it merges. A person can start it by hand for any branch or commit.
name: Private scan

on:
  workflow_dispatch:
    inputs:
      ref:
        description: A commit id or branch of this repository whose files to scan (the scanner comes from the branch this runs on)
        default: main

permissions:
  contents: read

concurrency:
  group: private-scan-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  private-export-scan:
    environment: main-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read   # main's scanner, and the commit to scan
      checks: write    # post the result on the commit
    env:
      HELDOUT_TOKEN_SET: ${{ secrets.HELDOUT_TOKEN != '' }}
    steps:
      - name: Check out the scanner (this branch, never the scanned commit's code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # After the checkout, so that a missing token is still reported on the commit.
      - name: Require the held-out token
        if: env.HELDOUT_TOKEN_SET != 'true'
        run: |
          echo "::error::HELDOUT_TOKEN is not set here, so the private set cannot be compared"
          exit 1
      - name: Check out the files to scan, as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: scanned
          persist-credentials: false
      - name: Fetch the private held-out set
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Expectrail/Expectrail-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      # The scanner needs only the standard library, so nothing is installed. Python imports from
      # this branch's checkout (the working directory), never from scanned/.
      - name: Export scan of the commit against the private set (counts only, never names)
        run: python -m agents.export_scan scanned/bench scanned/docs scanned/README.md scanned/apps --private heldout-set
      # Every value from the event reaches the script through env, never by expansion in the script.
      # A branch name gets no check: the script posts only on a full commit id.
      - name: Post the result on the scanned commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SCANNED_REF: ${{ inputs.ref }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 -I agents/scan_handoff.py report
          --repo "$REPO" --ref "$SCANNED_REF" --status "$STATUS" --run-url "$RUN_URL"
