name: Expectrail comment
on:
  workflow_run:
    workflows: [Expectrail verify]
    types: [in_progress, completed]
permissions: {}
concurrency:
  group: expectrail-judge-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
jobs:
  judge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/expectrail-verify.yml'
    environment: main-only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Load the trusted check publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Issue a token for the clearance publisher
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.EXPECTRAIL_CHECKS_APP_ID }}
          private-key: ${{ secrets.EXPECTRAIL_CHECKS_PRIVATE_KEY }}
          permission-checks: write
      - name: Start the checks and identify the base
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_TOKEN: ${{ steps.publisher.outputs.token }}
          CHECKS_APP: ${{ steps.publisher.outputs.app-slug }}
        run: python3 -m tools.ci_checks start
      - if: steps.start.outputs.base != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.start.outputs.base }}
          path: policy
          persist-credentials: false
      - if: steps.start.outputs.base != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - if: steps.start.outputs.base != ''
        run: python -m pip install jsonschema==4.26.0 pillow==12.3.0
      - name: Fetch the published capture and verify its digest
        if: steps.start.outputs.base != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.ci_checks download
      - name: Evaluate the saved runs from the base commit
        if: steps.start.outputs.base != ''
        id: judge
        working-directory: policy
        env:
          GAME: game/platformer
          SPECS: agents/specs
          ROUTES: |
            harness/routes/smoke.json
            harness/routes/combat.json
          RECORDING: docs/run-it/vision/clean.json
        run: python -m tools.ci_checks judge
      # #255 will write its receipt here from the trusted result.
      - name: Publish the trusted report
        if: always() && steps.start.outputs.matched == 'true'
        id: report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: expectrail-report
          path: ${{ runner.temp }}/expectrail-report
          retention-days: 14
          if-no-files-found: error
      - name: Complete the head checks and update the bounded comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_TOKEN: ${{ steps.publisher.outputs.token }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          REPORT_READY: ${{ steps.judge.outcome == 'success' && steps.report.outcome == 'success' && !cancelled() }}
        run: python3 -m tools.ci_checks finish
